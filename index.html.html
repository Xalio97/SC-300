Object.assign(EN.q,{
q001:{q:"The IT support team of the Lyon branch must be able to reset passwords for Lyon users only. You apply least privilege. What do you do?",
 opts:["Create an administrative unit containing the Lyon users and assign the Helpdesk Administrator role scoped to it","Assign the Helpdesk Administrator role at tenant level","Create a custom role with the password reset action and no scope","Add the technicians to a role-assignable group"],
 why:"The administrative unit is the mechanism that restricts scope: a role assigned within the unit only applies to the objects it contains.",
 ko:{1:"The role would cover the whole tenant, far beyond the need.",2:"A custom role restricts actions, not the scope of objects.",3:"A role-assignable group protects the group membership; it still does not limit the scope."}},
q002:{q:"An operator must create accounts, manage groups and assign licences, without touching privileged roles. Which built-in role do you choose?",
 opts:["User Administrator","License Administrator","Helpdesk Administrator","Global Administrator"],
 why:"User Administrator covers the creation and management of users and groups, along with licences.",
 ko:{1:"License Administrator assigns licences but does not create accounts.",2:"Helpdesk is limited to password resets for non-administrator users.",3:"Well beyond least privilege."}},
q003:{q:"You add the custom domain contoso.fr to the tenant. What is required to verify it?",
 opts:["Publish the TXT or MX record supplied by Entra at your registrar","Create a CNAME pointing to login.microsoftonline.com","Raise a ticket with Microsoft support","Add the UPN suffix in on-premises Active Directory"],
 why:"Proof of ownership goes through publishing the TXT (or MX) record generated by Entra in the public DNS zone.",
 ko:{1:"CNAMEs serve other scenarios such as autodiscover, not verification.",2:"Verification is self-service.",3:"The UPN suffix in AD matters later for synchronization but does not verify the domain."}},
q004:{q:"You want every employee in the Finance department to join a security group automatically. What requirement should you anticipate?",
 opts:["An Entra ID P1 licence and a dynamic membership rule on the department attribute","A P2 licence and PIM enabled on the group","A role-assignable group","A lifecycle workflow with a task that adds users to the group"],
 why:"Dynamic membership is a P1 feature, driven by a rule such as user.department -eq \"Finance\".",
 ko:{1:"PIM is about temporary role activation, not group population.",2:"Role-assignable is a protection property, unrelated to automatic membership.",3:"A lifecycle workflow answers an HR event, not a standing attribute criterion."}},
q005:{q:"A licence is assigned through a group. A user leaves the group. What happens?",
 opts:["The licence is removed automatically and their data enters a grace period","Nothing, the assigned licence stays until removed manually","The account is disabled","The licence is removed only after an access review"],
 why:"Group-based assignment is continuously re-evaluated: leaving the group removes the licence, and the affected services enter a grace period before data deletion.",
 ko:{1:"That is the behaviour of a directly assigned licence, not an inherited one.",2:"Removing a licence does not disable the account.",3:"No connection with access reviews."}},
q006:{q:"Sales staff use their personal computers to reach Microsoft 365 with their work account. What device state do you expect in Entra ID?",
 opts:["Microsoft Entra registered","Microsoft Entra joined","Hybrid Microsoft Entra joined","None, the device does not appear"],
 why:"Registration is the BYOD scenario: the device stays personal but becomes known to Entra, which allows it to be targeted in Conditional Access.",
 ko:{1:"Joining covers organisation-owned devices managed only in the cloud.",2:"Hybrid join assumes a device joined to on-premises Active Directory.",3:"A device accessing with a work account is indeed registered."}},
q007:{q:"You deploy custom security attributes to classify sensitive accounts. Which statement is accurate?",
 opts:["Even a Global Administrator must be granted a dedicated attribute role to read or set them","They are visible to every administrator by default","They replace directory extension attributes","They cannot be used in dynamic membership rules"],
 why:"Custom security attributes are deliberately walled off: the Attribute Definition Administrator or Attribute Assignment Administrator roles are required, Global Administrators included.",
 ko:{1:"It is exactly the opposite; access is denied by default.",2:"Both mechanisms coexist for different purposes.",3:"They can be used for targeting and filtering, notably in Conditional Access."}},
q008:{q:"You must stop standard users from inviting external people, while allowing a small partnerships team to do so. What do you configure?",
 opts:["In external collaboration settings, restrict invitations to admin roles and assign the Guest Inviter role to the team","Block B2B collaboration entirely","Create an administrative unit for guests","Route every invitation through an access package"],
 why:"External collaboration settings control who can invite, and the Guest Inviter role grants exactly that capability with no other privilege.",
 ko:{1:"The requirement is to keep collaboration for one team.",2:"An administrative unit scopes administration, not the right to invite.",3:"An access package is good governance, but it does not by itself decide who holds the invitation right."}},
q009:{q:"Guests from a partner tenant have already completed MFA in their own organisation, yet Entra asks again. How do you remove the double prompt?",
 opts:["In cross-tenant access settings, trust inbound MFA claims for that partner","Exclude guests from Conditional Access policies","Create a Conditional Access policy that never requires MFA for guests","Convert the guests into members"],
 why:"Cross-tenant access settings allow you to trust MFA performed in the home tenant, avoiding a second prompt without weakening the requirement.",
 ko:{1:"Excluding guests removes the protection.",2:"That amounts to dropping MFA for a whole population.",3:"Changing the user type does not change authentication and raises default permissions."}},
q010:{q:"Two group entities merge. Users of tenant A must automatically appear as guests in tenant B and stay up to date. Which solution?",
 opts:["Cross-tenant synchronization configured outbound on tenant A and accepted inbound on tenant B","Entra Connect Sync between the two tenants","Bulk invitation from a CSV file","Direct SAML federation between the two tenants"],
 why:"Cross-tenant synchronization provisions and maintains B2B objects from one tenant to the other, including updates and removals.",
 ko:{1:"Entra Connect synchronises from on-premises Active Directory, not between two tenants.",2:"A CSV is a one-off and maintains nothing over time.",3:"Direct federation targets external domains not managed by Entra."}},
q011:{q:"The organisation wants authentication to keep working if connectivity to the site drops, and wants alerts on leaked credentials. Which decisions do you take? (two answers)",
 opts:["Enable password hash synchronization","Keep pass-through authentication as the only method","Enable PHS as a fallback even when federation is in place","Move to AD FS"],
 why:"Password hash synchronization is the only method that makes authentication independent of on-premises servers, and it is also the prerequisite for the leaked credentials report.",
 ko:{1:"Pass-through authentication depends on on-premises agents: if the link drops, authentication fails.",3:"AD FS adds another dependency and works against the objective."}},
q012:{q:"After several acquisitions you must synchronise three Active Directory forests with no connectivity between them into a single tenant, with a minimal server footprint. Which tool?",
 opts:["Microsoft Entra Cloud Sync","Microsoft Entra Connect Sync","Microsoft Entra Connect Health","Cross-tenant synchronization"],
 why:"Cloud Sync relies on lightweight agents driven from the cloud and supports disconnected forests, which is precisely the merger scenario.",
 ko:{1:"Connect Sync assumes connectivity to every forest from a single server and a heavier configuration.",2:"Connect Health is a monitoring tool; it synchronises nothing.",3:"It links two tenants, not AD forests."}},
q013:{q:"Seamless single sign-on is being deployed. Is each statement true?",
 subs:[{s:"An AZUREADSSOACC computer object is created in Active Directory",why:"That account holds the Kerberos decryption key used for SSO."},
  {s:"The Kerberos decryption key must be rolled over regularly",why:"Microsoft recommends periodic rollover, without which SSO stops working."},
  {s:"Seamless SSO works on cloud-only Entra joined devices",why:"It targets devices joined to the on-premises domain; Entra joined devices use the primary refresh token."},
  {s:"The service URL must be in the browser's Intranet zone",why:"Otherwise the browser does not pass the Kerberos ticket automatically."}]},
q014:{q:"You must create 400 accounts from an HR export, in a repeatable and scriptable way. Which approach matches what the exam expects?",
 opts:["A Microsoft Graph PowerShell script that loops over the CSV and calls New-MgUser","The AzureAD PowerShell module with New-AzureADUser","Manual creation in the admin center","A dynamic membership rule"],
 why:"Microsoft Graph PowerShell is the current module; the portal's bulk import also exists, but the scenario asks for repeatability.",
 ko:{1:"The AzureAD and MSOnline modules are deprecated.",2:"Unmanageable at that volume and not repeatable.",3:"A dynamic rule populates a group; it does not create accounts."}},
q015:{q:"You want to stop standard users from registering new applications in the tenant. Where do you act?",
 opts:["Tenant user settings, app registration option","External collaboration settings","Authentication methods policy","Device settings"],
 why:"The Users can register applications setting lives in tenant user settings, and turning it off leaves the right to the appropriate roles only.",
 ko:{1:"Those settings cover guests.",2:"Unrelated to registrations.",3:"They govern device join and registration."}},
q016:{q:"You want an alert if a synchronization agent stops exporting to the tenant. Which component do you use?",
 opts:["Microsoft Entra Connect Health","The provisioning log","Identity Secure Score","Entra diagnostic settings"],
 why:"Connect Health monitors synchronization, pass-through authentication and AD FS agents, and raises alerts on export failures.",
 ko:{1:"The provisioning log traces application and cross-tenant provisioning.",2:"It rates security posture, unrelated to agent health.",3:"They route logs; they do not provide ready-made health alerts."}},
q017:{q:"An administrator says they cannot modify a user even though they hold a role that allows it. Which check is most relevant first?",
 opts:["Check the assignment scope: role limited to an administrative unit, or target object inside a restricted management unit","Check the target user's licence","Check membership of the Global Administrators group","Check the password policy"],
 why:"Every role assignment has a scope: tenant, administrative unit or a single object. Restricted management units additionally block administrators outside the scope.",
 ko:{1:"Licences do not gate administration of the object.",2:"The goal is not to grant more rights but to understand the denial.",3:"Unrelated to a failed object modification."}},
q018:{q:"A new joiner must register a passkey on their first day, without ever receiving an initial password by email. Which method do you use?",
 opts:["Generate a one-time Temporary Access Pass","Create a temporary password to be changed at first sign-in","Send a code by SMS","Assign a hardware OATH token"],
 why:"The Temporary Access Pass is designed for passwordless bootstrapping: it allows one authentication in order to register a strong method.",
 ko:{1:"That assumes a password, which the scenario rules out.",2:"SMS is weak and does not reliably support passkey registration.",3:"The token itself must be activated through a prior authentication."}},
q019:{q:"A Conditional Access policy requires Require multifactor authentication AND Require device to be marked as compliant, with Require all the selected controls. What happens to a user who completed MFA on a non-compliant device?",
 opts:["Access is blocked because both controls must be satisfied","Access is granted because one control is enough","The user is prompted to register the device and then gets access","The policy is skipped as no control applies"],
 why:"With Require all the selected controls, controls combine with AND: one unmet control means a block.",
 ko:{1:"That is the behaviour of Require one of the selected controls.",2:"Conditional Access offers no automatic compliance remediation.",3:"The policy does apply; it simply fails on one control."}},
q020:{q:"An executive is blocked at sign-in and you must identify the responsible policy without reproducing the sign-in. Which tool?",
 opts:["The Conditional Access detail of the matching entry in the sign-in logs","The What If tool","Identity Secure Score","The audit log"],
 why:"The sign-in log keeps, for each attempt, the list of evaluated policies with their result: applied, failed, not applied.",
 ko:{1:"What If simulates a hypothetical sign-in; useful beforehand, but the real event is already recorded.",2:"That is an overall posture indicator.",3:"It traces object changes, not authentication decisions."}},
q021:{q:"You are rolling out a policy that requires MFA for all users. Which precaution is essential?",
 opts:["Exclude at least two break-glass accounts and start the policy in report-only mode","Permanently exclude the Global Administrator role","Enable security defaults first","Apply the policy to guests only"],
 why:"Break-glass accounts protect against a full tenant lockout, and report-only mode lets you measure the impact before enforcement.",
 ko:{1:"Permanently excluding administrators leaves the most sensitive accounts without MFA.",2:"Security defaults are incompatible with Conditional Access.",3:"That does not meet the stated requirement."}},
q022:{q:"An account is disabled while an Exchange Online session is active. You want access to stop within minutes rather than at token expiry. Which capability?",
 opts:["Continuous access evaluation","Configurable session lifetime","Sign-in frequency set to 1 hour","App enforced restrictions"],
 why:"CAE lets the resource provider react in near real time to critical events such as account disablement or session revocation.",
 ko:{1:"It does not react to an event, it only caps the duration.",2:"An hour is still an exposure window and affects every user.",3:"They limit features inside the application without revoking the session."}},
q023:{q:"A SharePoint site holds highly sensitive data. You want stronger authentication for that site only, without hardening all of SharePoint. What do you put in place?",
 opts:["An authentication context referenced by a sensitivity label, plus a dedicated Conditional Access policy","A Conditional Access policy on the SharePoint Online application","A session policy with a reduced sign-in frequency","An access package for the site"],
 why:"Authentication context lets you target a specific resource inside an application and attach stronger requirements to it.",
 ko:{1:"That would apply to all of SharePoint Online.",2:"A shorter session does not raise the authentication level required for a given resource.",3:"An access package governs assignment, not the requirement at sign-in."}},
q024:{q:"You want an administrator to be unable to delete a Conditional Access policy without strong reauthentication, even when holding the necessary role. Which capability?",
 opts:["Protected actions tied to an authentication context","PIM with approval","A restricted management administrative unit","A user risk policy"],
 why:"Protected actions attach Conditional Access requirements to specific administrative operations, on top of the role's permissions.",
 ko:{1:"PIM controls obtaining the role, not each operation once the role is active.",2:"It restricts the scope of user objects, not configuration operations.",3:"It reacts to a compromise signal, not to a sensitive action."}},
q025:{q:"You want to force a secure password change for accounts whose user risk is high. What is the expected configuration?",
 opts:["A Conditional Access policy targeting high user risk that requires a password change, with MFA beforehand","A sign-in risk policy in block mode","An MFA registration campaign","An access review on risky users"],
 why:"User risk rates the account, and the expected remediation is a secure password change preceded by MFA. Microsoft now recommends carrying these policies in Conditional Access.",
 ko:{1:"Sign-in risk rates the current session, not the compromise of the account.",2:"A campaign registers a method; it does not remediate a compromised account.",3:"An access review handles rights, not compromise."}},
q026:{q:"A user flagged as risky has proved it was a legitimate trip. Which action teaches the system correctly?",
 opts:["Dismiss the user risk in ID Protection","Delete the user from the logs","Reset the password","Exclude the user from risk policies"],
 why:"Dismissing the risk returns the account to no risk and feeds the model, unlike an exclusion which leaves the account unprotected.",
 ko:{1:"Logs cannot be edited.",2:"That would remediate a real risk, but it is not the right answer for a false positive.",3:"Exclusion creates a lasting gap."}},
q027:{q:"Synchronised users must be able to reset their own password, with immediate effect on domain file servers. What is required?",
 opts:["SSPR with password writeback configured in Entra Connect","SSPR alone, on the Free tier","Entra password protection on the domain controllers","Pass-through authentication"],
 why:"Without writeback the new password exists only in the cloud, and domain resources would keep expecting the old one.",
 ko:{1:"SSPR for cloud accounts requires P1 and does not handle the return path to AD.",2:"It prevents weak passwords, unrelated to reset.",3:"It validates passwords; it does not write them back."}},
q028:{q:"You are deploying Entra password protection on Active Directory. Which components are required? (two answers)",
 opts:["A password protection proxy service","An agent installed on the domain controllers","AD FS","Pass-through authentication"],
 why:"The on-premises deployment combines one or more proxies that reach the cloud, plus the DC agent installed on every domain controller to be protected.",
 ko:{2:"AD FS plays no part in this mechanism.",3:"Pass-through authentication is independent of password protection."}},
q029:{q:"The CISO requires phishing-resistant methods for administrators. Which combination do you choose?",
 opts:["FIDO2 passkeys, Windows Hello for Business or certificate-based authentication","Authenticator with number matching plus SMS fallback","Hardware OATH tokens and voice calls","A long password and security questions"],
 why:"Only those three families are classed as phishing-resistant, because the secret cannot be replayed on a fraudulent site.",
 ko:{1:"Number matching is robust but remains a factor that can be diverted, and SMS is weak.",2:"Neither OATH tokens nor voice calls are phishing-resistant.",3:"That is not multifactor at all."}},
q030:{q:"The tenant still uses security defaults. You need granular Conditional Access policies. What is the first action?",
 opts:["Turn off security defaults","Enable legacy per-user MFA in parallel","Put the Conditional Access policies in report-only mode","Enable PIM"],
 why:"Security defaults and Conditional Access are mutually exclusive: the former must be turned off, once the replacement policies are prepared.",
 ko:{1:"Per-user MFA is the legacy mechanism and a source of conflicts.",2:"Report-only mode is useful, but the policies stay inert while security defaults are on.",3:"PIM plays no part here."}}
});

Object.assign(EN.q,{
q031:{q:"You want to block access from every country except France and Belgium. Which approach is correct?",

 why:"The standard approach is an allow-list by exclusion: target Any location and exclude the allowed named location, which stays correct as geography evolves.",
 ko:{1:"Unmanageable and error-prone every time the geography changes.",2:"A device filter targets device properties, not geography.",3:"Sign-in risk does not encode a geographic policy."}},
q032:{q:"On unmanaged devices, users must be able to view documents in the browser but not download them. What do you configure?",
 opts:["A Conditional Access policy with app enforced restrictions, plus the matching restriction in SharePoint Online","A session policy with sign-in frequency","A full block of non-compliant devices","A user risk policy"],
 why:"App enforced restrictions pass the unmanaged device signal to SharePoint and Exchange, which then deliver the limited experience.",
 ko:{1:"It does not change download capability.",2:"The requirement is degraded access, not a block.",3:"Unrelated to device management."}},
q033:{q:"Contractors must reach an internal server over RDP without a VPN, with Conditional Access applied. Which solution?",
 opts:["Microsoft Entra Private Access with the Global Secure Access client","Application proxy","Entra Domain Services","An access package"],
 why:"Private Access supports arbitrary protocols including RDP, with a client installed and Conditional Access applied per application or segment.",
 ko:{1:"Application proxy only publishes web applications.",2:"It provides a managed domain, not remote access.",3:"It governs rights assignment, not network connectivity."}},
q034:{q:"60% of users are registered for SMS only. You want to move them to Microsoft Authenticator without blocking them. Which capability?",
 opts:["A registration campaign that prompts the user to add Authenticator at sign-in","Immediate mandatory combined registration","A Conditional Access policy blocking SMS","A Temporary Access Pass for each of them"],
 why:"The registration campaign nudges users towards a stronger method at sign-in, with the option to snooze, which avoids lockouts.",
 ko:{1:"Too abrupt for a population that size.",2:"That would indeed block users, contrary to the objective.",3:"A TAP is an individual bootstrap tool, not a mass migration mechanism."}},
q035:{q:"Put the recommended rollout cycle of a new Conditional Access policy in order.",
 items:["Define the need and identify the affected populations and applications","Create the policy in report-only mode","Analyse the impact in the sign-in logs and the insights tab","Add the required exclusions, including break-glass accounts","Enable the policy for a pilot group","Extend to the whole population and monitor"],
 why:"Report-only mode and impact analysis always come before enforcement, and rollout proceeds in waves starting with a pilot."},
q036:{q:"An employee leaves immediately. You must cut access to sessions that are already open. Which action is the most direct?",
 opts:["Revoke the user's sessions, which invalidates refresh tokens","Reset their password","Remove their licences","Remove them from every group"],
 why:"Revocation invalidates refresh tokens; combined with CAE, the effect on active sessions is almost immediate.",
 ko:{1:"Useful, but access tokens already issued may remain valid.",2:"Removing a licence does not eject sessions.",3:"That removes future rights, not current sessions."}},
q037:{q:"The organisation wants to authenticate with existing smart cards, directly against Entra ID, and retire AD FS. Which method?",
 opts:["Entra certificate-based authentication, with certificate authorities uploaded and binding rules configured","Keep AD FS federation","OATH tokens","Pass-through authentication"],
 why:"Entra CBA validates an X.509 certificate natively, which is exactly the exit path from AD FS for smart cards.",
 ko:{1:"The objective is to remove AD FS.",2:"An OATH token does not replace a smart card certificate.",3:"It validates a password, not a certificate."}},
q038:{q:"A service principal signs in from an unusual anonymous IP address. You want to handle that kind of risk. What is the prerequisite?",
 opts:["Workload Identities Premium licences, which unlock risk policies and Conditional Access for workload identities","Entra ID P1","A Defender for Cloud Apps licence","An ID Governance licence"],
 why:"Risky workload identities and Conditional Access applied to service principals fall under the Workload ID licence.",
 ko:{1:"P1 covers Conditional Access for users, not for application identities.",2:"MDCA handles cloud applications, not this case.",3:"Governance covers reviews and access packages."}},
q039:{q:"You want to start quickly from a proven baseline rather than writing policies from scratch. How do Conditional Access templates behave?",
 opts:["They create a preconfigured policy, report-only by default, which you adjust before enabling","They enable the policy immediately for everyone","They replace existing policies","They are only available in tenants with no policies"],
 why:"Templates produce a ready-made but inactive policy, which leaves time to define exclusions.",
 ko:{1:"That would be an unacceptable lockout risk.",2:"They are added alongside existing policies.",3:"No such restriction."}},
q040:{q:"An Azure function must read secrets from Key Vault without storing credentials. Which identity?",
 opts:["A system-assigned managed identity, with a role assignment on the vault","An app registration with a client secret","A service user account","A shared access key"],
 why:"A managed identity removes every secret to manage and its rotation is handled by the platform.",
 ko:{1:"A client secret has to be stored and renewed, which the scenario rules out.",2:"A user account cannot carry MFA and blurs traceability.",3:"That is not an Entra identity."}},
q041:{q:"Five virtual machines in the same department must share identical permissions on a storage account, and the identity must survive the deletion of one machine. Which choice?",
 opts:["A user-assigned managed identity attached to the five machines","Five system-assigned managed identities","A service principal with a certificate","A security group containing the machines"],
 why:"A user-assigned identity is an independent object, reusable by several resources and not destroyed with any one of them.",
 ko:{1:"That multiplies the role assignments to maintain.",2:"A certificate introduces a secret to manage when Azure can do without one.",3:"A device group does not carry Azure RBAC permissions that way."}},
q042:{q:"A daemon application must read every calendar in the tenant with no signed-in user. Which configuration?",
 opts:["A Calendars.Read application permission, with admin consent","A Calendars.Read delegated permission","A Calendars.ReadWrite delegated permission with user consent","The Exchange Administrator Entra role assigned to the application"],
 why:"With no user present only an application permission works, and it always requires admin consent.",
 ko:{1:"A delegated permission assumes a signed-in user and is limited to their own data.",2:"Same problem, plus the wrong consent.",3:"Entra roles do not replace Graph permissions for a daemon."}},
q043:{q:"You want to stop users consenting to third-party applications while avoiding a flood of tickets. Which configuration?",
 opts:["Turn off user consent and enable the admin consent request workflow","Turn off user consent only","Allow consent for verified publishers only, with no workflow","Block app registration"],
 why:"The request workflow lets users ask for approval, which keeps control without creating a silent dead end.",
 ko:{1:"Users would be blocked with no route forward.",2:"A valid middle ground, but it does not meet the requirement to stop user consent.",3:"That concerns creating applications, not consenting to them."}},
q044:{q:"You integrate a SaaS application with SAML SSO. The application must also create and disable accounts automatically. What else do you configure?",
 opts:["Automatic SCIM provisioning on the enterprise application","An access package","Cross-tenant synchronization","Entra Connect Sync"],
 why:"SSO handles authentication, provisioning handles the account lifecycle in the target application; they are two separate configurations.",
 ko:{1:"It governs access assignment, not account creation in the application.",2:"It links two Entra tenants.",3:"It synchronises from on-premises Active Directory."}},
q045:{q:"An internal web application must be reachable from the internet, without a VPN and without opening an inbound port. Which solution?",
 opts:["Application proxy with a connector installed on the internal network","An Azure VPN gateway","Entra Domain Services","A NAT rule on the firewall"],
 why:"The connector opens an outbound connection to the service, which avoids any inbound exposure, and publication goes through an enterprise application subject to Conditional Access.",
 ko:{1:"That assumes a VPN client, contrary to the scenario.",2:"Unrelated to publishing applications.",3:"That is exactly the inbound exposure to avoid."}},
q046:{q:"An enterprise application has Assignment required turned on. What is the consequence?",
 opts:["Only explicitly assigned users and groups can authenticate to the application","Everyone in the tenant can sign in, but the app only appears for assigned users","Conditional Access is bypassed","Provisioning becomes mandatory"],
 why:"Without an assignment the authentication attempt is refused: it is the simplest access control at application level.",
 ko:{1:"That describes visibility in the My Apps portal, not the assignment requirement.",2:"Conditional Access still applies.",3:"The two features are independent."}},
q047:{q:"A developer reports that authentication fails after going to production, with a URI mismatch error. What do you check?",
 opts:["The redirect URI declared in the app registration must match the one sent exactly, including protocol and path casing","The client secret has expired","The API permissions have not been consented to","The account is not assigned to the application"],
 why:"A URI mismatch error is specific: Entra compares the redirect URI received against the registered list, with no tolerance.",
 ko:{1:"An expired secret produces a different, invalid-credential error.",2:"Missing consent produces a consent error.",3:"A missing assignment returns an access denied error, not a URI error."}},
q048:{q:"A line-of-business application must distinguish Reader and Approver, and the assignment must happen in Entra rather than in the application. What do you create?",
 opts:["App roles in the app registration manifest, then assigned to groups","Custom Entra roles","Administrative units","Custom security attributes"],
 why:"App roles are emitted in the token, which lets the application decide based on the role assigned in Entra.",
 ko:{1:"Entra roles govern tenant administration, not an application's business logic.",2:"They scope administration.",3:"They classify objects, with no effect on application tokens."}},
q049:{q:"You want to stop file downloads from a third-party SaaS application on unmanaged devices, with real-time control inside the session.",
 opts:["Conditional Access App Control with a session policy in Defender for Cloud Apps","App enforced restrictions","A blocking Conditional Access policy","Cloud discovery"],
 why:"Conditional Access App Control places the session behind a reverse proxy, which allows inspection and real-time blocking of actions, including for third-party applications.",
 ko:{1:"They only work with Microsoft services that know how to interpret them.",2:"The requirement is partial access, not a block.",3:"Discovery identifies usage; it controls nothing."}},
q050:{q:"You want to detect and automatically revoke OAuth applications that obtain high-privilege permissions on mailboxes. Which capability?",
 opts:["OAuth app policies in Defender for Cloud Apps","Conditional Access policies","The provisioning log","App roles"],
 why:"MDCA inventories consented OAuth applications, rates their privilege level and allows consent to be revoked, manually or by policy.",
 ko:{1:"Conditional Access applies to sign-ins, not to consent already granted.",2:"It traces account provisioning.",3:"They define business roles."}},
q051:{q:"Management wants to know which cloud applications are used without approval. What is the first step in Defender for Cloud Apps?",
 opts:["Set up cloud discovery by sending firewall or proxy logs, or through the Defender for Endpoint integration","Connect each application with an API connector","Create session policies","Enable app enforced restrictions"],
 why:"Discovery relies on traffic logs or on devices onboarded to Defender for Endpoint to reveal shadow IT.",
 ko:{1:"A connector assumes you already know the application and administer it.",2:"Policies come after discovery.",3:"Unrelated to a usage inventory."}},
q052:{q:"An operator must manage every enterprise application, including admin consent, but must not be able to create registrations. Which role do you prefer?",
 opts:["Cloud Application Administrator","Application Administrator","Global Administrator","Application Developer"],
 why:"Cloud Application Administrator matches Application Administrator without application proxy management, and remains the least-privilege choice in this kind of scenario.",
 ko:{1:"It adds application proxy management, beyond the need.",2:"Excessive.",3:"That role is precisely what allows registrations to be created, which you want to avoid."}},
q053:{q:"About managed identities, is each statement true?",
 subs:[{s:"A system-assigned managed identity is deleted with the resource",why:"Its lifecycle is tied to the resource."},
  {s:"A managed identity can be granted Microsoft Graph application permissions",why:"Graph app roles are assigned to the managed identity's service principal."},
  {s:"A managed identity has a client secret to renew every two years",why:"No secret is exposed; the platform manages the credentials."},
  {s:"A managed identity can be used from a server hosted outside Azure",why:"It assumes an Azure resource; outside Azure you need a service principal or workload identity federation."}]},
q054:{q:"Users complain they cannot find their business applications in the My Apps portal. Which feature improves the layout?",
 opts:["Application collections, assigned to groups","App roles","Access packages","Administrative units"],
 why:"Collections group applications by theme or business line and are targeted at groups of users.",
 ko:{1:"They carry authorisation inside the application.",2:"They handle access requests, not presentation.",3:"They concern delegated administration."}},
q055:{q:"Global administrators must activate their role for a maximum of eight hours, with justification and approval. Which configuration?",
 opts:["Eligible assignments in PIM, with role settings enforcing duration, justification and approval","Permanent active assignments plus a monthly access review","A Conditional Access policy with sign-in frequency","A restricted management administrative unit"],
 why:"PIM separates eligibility from activation: the role settings define maximum duration, MFA, justification and approval.",
 ko:{1:"The privilege would stay permanent between reviews.",2:"That has no effect on holding the role.",3:"It protects objects, not role assignment."}},
q056:{q:"Which practices apply to break-glass emergency accounts? (two answers)",
 opts:["Exclude them from Conditional Access policies that could lock them out","Create at least two cloud-only accounts with no dependency on synchronization","Synchronise them from Active Directory for consistency","Use them daily for administration"],
 why:"These accounts must survive a federation outage, a policy mistake and an on-premises incident; every use should raise an alert.",
 ko:{2:"A dependency on synchronization defeats their purpose.",3:"Their use must be exceptional and alert-generating."}},
q057:{q:"An external contractor must be able to request access to a SharePoint site, two groups and an application, for six months, with approval from the project lead. Which solution?",
 opts:["An access package in a catalog, with an approval policy and expiry","A quarterly access review","A direct assignment by the helpdesk","A custom role"],
 why:"An access package bundles several resources and frames the request, the approval and the expiry, including for external users.",
 ko:{1:"It checks already-granted access after the fact.",2:"Neither traceable nor automatically expiring.",3:"That concerns tenant administration."}},
q058:{q:"You want a partner to request access packages themselves, without inviting each of their staff in advance. What do you configure?",
 opts:["A connected organization for the partner's domain, with a policy allowing users not yet in the directory","Direct federation","Cross-tenant synchronization","A bulk CSV invitation"],
 why:"A connected organization defines the partner tenants or domains whose users may request a package; the guest object is created on approval.",
 ko:{1:"That handles authentication for non-Entra domains, not package requests.",2:"It provisions in bulk, with no request logic.",3:"That assumes you know every staff member in advance."}},
q059:{q:"An access review on a group is configured with If reviewers do not respond: Remove access. A reviewer does not respond. What happens?",
 opts:["Access is removed for unreviewed users at the end of the review","Access is kept and a reminder is sent","The review is extended automatically","The users are disabled"],
 why:"That setting defines exactly what happens to missing decisions; the other options are to keep access or to apply the recommendations.",
 ko:{1:"That is the behaviour of the No change option.",2:"There is no automatic extension.",3:"A review removes access; it does not disable the account."}},
q060:{q:"You want to recertify guests in Microsoft 365 groups every quarter, letting guests self-attest if the owner does not respond. Which reviewer type?",
 opts:["Group owners, with a second stage assigned to the users themselves","Global Administrator only","The guests' managers","A group of external auditors"],
 why:"Reviews accept several reviewer types and support multi-stage reviews; self-attestation is designed for guests.",
 ko:{1:"Not sustainable at scale and contrary to least privilege.",2:"Guests rarely have a manager recorded in the tenant.",3:"They lack the business context."}}
});

q067:{q:"An access package request is stuck. The requester says they were approved. What do you check first?",

q068:{q:"An access review has ended but denied access is still in place. What is the most likely explanation?",

q069:{q:"Put the setup of entitlement management for a cross-company project in order.",

q070:{q:"For each requirement, select the appropriate diagnostic destination.",

q071:{q:"An engineer must hold the Contributor role on an Azure resource group only during maintenance windows. Which solution?",

q072:{q:"You want guests inactive for 90 days to be blocked automatically and then deleted. Which capability?",

q073:{q:"An employee changes their name. You update their user principal name. Which consequence should you anticipate?",

q074:{q:"Management wants the sign-in page to show the logo and an internal help message. Where do you configure that?",

q075:{q:"You invite 200 partners. Some never redeem their invitation. What do you see in the directory?",

   NOYAU — persistance locale, état, utilitaires
   ===================================================================== */
const KEY="sc300.v1";
let MEM=null, PERSIST=true;
const DEF=()=>({v:1,theme:"light",examDate:"",obj:{},notes:{},q:{},cards:{},kql:{},labs:{},sess:[],exams:[],custom:[],streak:{n:0,last:""}});
function load(){
  try{const r=localStorage.getItem(KEY);MEM=r?Object.assign(DEF(),JSON.parse(r)):DEF();}
  catch(e){PERSIST=false;MEM=DEF();}
  return MEM;
}
function save(){
  if(!PERSIST)return;
  try{localStorage.setItem(KEY,JSON.stringify(MEM));}
  catch(e){PERSIST=false;toast("Sauvegarde locale indisponible dans ce contexte. Exportez vos données pour ne rien perdre.");}
}
const S=()=>MEM;
function toast(msg){
  const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);
  setTimeout(()=>d.remove(),2600);
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmtT=s=>`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;

/* index du référentiel */
const OBJ_INDEX={};
REFERENTIEL.forEach(d=>d.groups.forEach(g=>g.items.forEach(([id,label,en])=>{
  OBJ_INDEX[id]={id,label,en,dom:d.id,domTitle:d.title,group:g.title,groupId:g.id};
})));
const allQuestions=()=>QUESTIONS.concat(S().custom||[]);
const domOf=q=>(OBJ_INDEX[q.o]||{}).dom||"D1";
const STAT_LABEL=["Non abordé","À revoir","Vu","Maîtrisé"];

/* répétition espacée — Leitner */
const BOX_DAYS=[0,1,3,7,16,35];
function schedule(rec,ok){
  rec.box=ok?Math.min(5,(rec.box||1)+1):1;
  const d=new Date();d.setDate(d.getDate()+BOX_DAYS[rec.box]);
  rec.due=d.toISOString().slice(0,10);
  return rec;
}
function qrec(id){const s=S();return s.q[id]||(s.q[id]={seen:0,ok:0,ko:0,box:0,due:today(),conf:null,flag:false,last:null});}
function markStreak(){
  const s=S(),t=today();
  if(s.streak.last===t)return;
  s.streak.n=(s.streak.last && days(s.streak.last,t)===1)?s.streak.n+1:1;
  s.streak.last=t;
}

/* scores */
function domScore(dom){
  const objs=Object.values(OBJ_INDEX).filter(o=>o.dom===dom);
  const cov=objs.reduce((a,o)=>a+((S().obj[o.id]||0)/3),0)/(objs.length||1);
  const qs=allQuestions().filter(q=>domOf(q)===dom);
  let ok=0,tot=0;
  qs.forEach(q=>{const r=S().q[q.id];if(r&&r.seen){ok+=r.ok;tot+=r.ok+r.ko;}});
  const acc=tot?ok/tot:0;
  const reach=qs.length?qs.filter(q=>S().q[q.id]&&S().q[q.id].seen).length/qs.length:0;
  return Math.round((cov*35+acc*45+reach*20));
}
function readiness(){
  return Math.round(REFERENTIEL.reduce((a,d)=>a+domScore(d.id)*d.w,0)/100*10);
}
function objLevel(id){
  const st=S().obj[id]||0;
  const qs=allQuestions().filter(q=>q.o===id);
  let ok=0,tot=0;qs.forEach(q=>{const r=S().q[q.id];if(r){ok+=r.ok;tot+=r.ok+r.ko;}});
  if(!st && !tot)return 0;
  if(st===3 && (!tot||ok/tot>=.8))return 4;
  if(tot && ok/tot<.5)return 1;
  if(st>=2||(tot&&ok/tot>=.8))return 3;
  return 2;
}

let SES=null, TICK=null;
function buildPool(f){
  let p=allQuestions();
  if(f.dom)p=p.filter(q=>domOf(q)===f.dom);
  if(f.obj)p=p.filter(q=>q.o===f.obj);
  const s=S();
  if(f.mode==="new")p=p.filter(q=>!s.q[q.id]||!s.q[q.id].seen);
  if(f.mode==="due")p=p.filter(q=>{const r=s.q[q.id];return r&&r.seen&&r.due<=today();});
  if(f.mode==="ko")p=p.filter(q=>{const r=s.q[q.id];return r&&(r.ko>0||r.flag);});
  if(f.mode==="flag")p=p.filter(q=>{const r=s.q[q.id];return r&&r.flag;});
  if(f.mode==="guess")p=p.filter(q=>{const r=s.q[q.id];return r&&r.conf==="guess";});
  return shuffle(p).slice(0,f.n||20);
}
function startSession(list,opts){
  SES={list,i:0,ans:{},res:{},exam:!!(opts&&opts.exam),start:Date.now(),dur:(opts&&opts.dur)||0,
       done:false,revealed:false,paused:false,left:(opts&&opts.dur)||0};
  if(SES.exam)startTick();
  render();
}
function startTick(){
  clearInterval(TICK);
  SES.start=Date.now();
  TICK=setInterval(()=>{
    if(!SES||!SES.exam||SES.paused||SES.done){clearInterval(TICK);return;}
    const left=SES.left-Math.floor((Date.now()-SES.start)/1000);
    const el=document.getElementById("timer");
    if(el){el.textContent=fmtT(Math.max(0,left));el.className="timer"+(left<300?" warn":"");}
    if(left<=0){clearInterval(TICK);finishExam();}
  },1000);
}
const timeLeft=()=>SES.paused?SES.left:Math.max(0,SES.left-Math.floor((Date.now()-SES.start)/1000));
function pauseExam(){SES.left=timeLeft();SES.paused=true;clearInterval(TICK);save();render();}
function resumeExam(){SES.paused=false;startTick();render();}
function getAns(q){return SES.ans[q.id]||(SES.ans[q.id]={sel:[],order:q.t==="order"?shuffle(q.items):null,subs:{},hot:{}});}
function isCorrect(q,a){
  if(q.t==="single"||q.t==="multi"){const A=(q.a||[]).slice().sort().join(","),B=(a.sel||[]).slice().sort().join(",");return A===B&&B!=="";}
  if(q.t==="order")return (a.order||[]).join("|")===q.items.join("|");
  if(q.t==="yesno")return q.subs.every((s,i)=>a.subs[i]===s.a);
  if(q.t==="hot")return q.rows.every((r,i)=>a.hot[i]===r.a);
  return false;
}
function answered(q,a){
  if(q.t==="single"||q.t==="multi")return (a.sel||[]).length>0;
  if(q.t==="order")return true;
  if(q.t==="yesno")return q.subs.every((s,i)=>a.subs[i]!==undefined);
  if(q.t==="hot")return q.rows.every((r,i)=>a.hot[i]!==undefined);
  return false;
}
/* les réponses sont stockées sur l'index d'origine : la traduction ne
   change que l'affichage, jamais la correction */
function renderQuestion(q0,reveal,opt){
  opt=opt||{};
  const q=locQ(q0),a=getAns(q0),o=OBJ_INDEX[q0.o]||{},ok=isCorrect(q0,a);
  const TYPES={single:T("q_single"),multi:T("q_multi"),order:T("q_order"),yesno:T("q_yesno"),hot:T("q_hot")};
  const order=q0.t==="order"?a.order:null;
  const trIdx=q0.t==="order"&&isEN()&&q.items!==q0.items;
  let h=`<div class="qmeta"><span class="chip key">${o.dom||""} · ${q0.o}</span><span class="chip">${TYPES[q0.t]}</span>
    ${qTranslated(q0)?"":`<span class="chip signal" title="${esc(T("dt_untranslated"))}">FR</span>`}
    <span class="small muted">${esc(refObj(q0.o,o.label||""))}</span>
    <button class="btn sm ghost" id="flagq" style="margin-left:auto">${(S().q[q0.id]||{}).flag?T("q_flagged"):T("q_flag")}</button></div>
    <div class="qtext">${esc(q.q)}</div>`;
  if(q0.t==="single"||q0.t==="multi"){
    h+=`<div class="opts">`+q.opts.map((t,i)=>{
      let c="opt"+(a.sel.includes(i)?" sel":"");
      if(reveal){c="opt";if(q0.a.includes(i))c+=a.sel.includes(i)?" ok":" miss";else if(a.sel.includes(i))c+=" ko";}
      return `<button class="${c}" data-opt="${i}" ${reveal?"disabled":""}><span class="k">${String.fromCharCode(65+i)}</span><span>${esc(t)}</span></button>`;
    }).join("")+`</div>`;
    if(q0.t==="multi")h+=`<div class="small muted" style="margin-top:8px">${T("q_multihint")}</div>`;
  }
  if(q0.t==="order"){
    h+=`<div class="orderlist">`+order.map((t,i)=>{
      const good=reveal&&q0.items[i]===t;
      const lbl=trIdx?q.items[q0.items.indexOf(t)]:t;
      return `<div class="orderitem" style="${reveal?`border-color:${good?"var(--grant)":"var(--block)"}`:""}">
        <span class="num">${i+1}</span><span>${esc(lbl)}</span>
        ${reveal?"":`<span class="mv"><button data-mv="${i}" data-d="-1" ${i===0?"disabled":""}>↑</button><button data-mv="${i}" data-d="1" ${i===order.length-1?"disabled":""}>↓</button></span>`}</div>`;
    }).join("")+`</div>`;
    if(reveal&&!ok)h+=`<div class="small" style="margin-top:10px"><b>${T("q_expected")}</b><ol style="margin:6px 0;padding-left:20px">${q.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>`;
  }
  if(q0.t==="yesno"){
    h+=`<div class="hot">`+q.subs.map((s,i)=>`<div class="r"><div>${esc(s.s)}
      ${reveal?`<div class="small muted" style="margin-top:3px">${a.subs[i]===s.a?"✓":"✗"} ${esc(s.why)}</div>`:""}</div>
      <div class="seg">${[true,false].map(v=>`<button data-sub="${i}" data-val="${v}" class="${a.subs[i]===v?"on":""}"
        style="${reveal&&v===s.a?"box-shadow:inset 0 0 0 2px var(--grant)":""}">${v?T("q_true"):T("q_false")}</button>`).join("")}</div></div>`).join("")+`</div>`;
  }
  if(q0.t==="hot"){
    h+=`<div class="hot">`+q.rows.map((r,i)=>`<div class="r"><div>${esc(r.s)}
      ${reveal?`<div class="small muted" style="margin-top:3px">${a.hot[i]===r.a?"✓":"✗ "+T("q_expects")+esc(r.options[r.a])} — ${esc(r.why)}</div>`:""}</div>
      <select data-hot="${i}" ${reveal?"disabled":""}><option value="">${T("q_choose")}</option>
      ${r.options.map((o2,j)=>`<option value="${j}" ${a.hot[i]===j?"selected":""}>${esc(o2)}</option>`).join("")}</select></div>`).join("")+`</div>`;
  }
  if(reveal){
    h+=`<div class="why ${ok?"":"ko"}"><h4>${ok?T("q_ok"):T("q_ko")}</h4><div>${esc(q.why||"")}</div>`;
    if(q.ko&&Object.keys(q.ko).length)
      h+=`<ul>`+Object.entries(q.ko).map(([i,t])=>`<li><b>${String.fromCharCode(65+ +i)}.</b> ${esc(t)}</li>`).join("")+`</ul>`;
    h+=`</div>`;
    if(!opt.noActions){
      h+=`<div class="row" style="margin-top:12px"><button class="btn key" id="next">${SES.i<SES.list.length-1?T("q_next"):T("q_finish")}</button>
      <button class="btn ghost sm" id="notethis">${S().notes[q0.o]?T("q_notemod"):T("q_note")}</button></div>
      <div id="notebox" style="display:none;margin-top:10px"><textarea id="noteta" placeholder="${T("q_noteph")}">${esc(S().notes[q0.o]||"")}</textarea>
      <button class="btn sm" id="savenote" style="margin-top:6px">${T("q_savenote")}</button></div>`;
    }
  }else{
    h+=`<div class="row" style="margin-top:16px">
      ${opt.hideCheck?"":`<button class="btn key" id="check">${T("q_check")}</button>`}
      <span class="small muted">${T("q_conf")}</span>
      <div class="conf seg">${[["sure",T("q_sure")],["mid",T("q_mid")],["guess",T("q_guess")]].map(([v,t])=>`<button data-conf="${v}">${t}</button>`).join("")}</div></div>`;
  }
  return h;
}
function bindQuestion(q,reveal){
  const a=getAns(q);
  document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.opt;
    if(q.t==="single")a.sel=[i];
    else a.sel.includes(i)?a.sel=a.sel.filter(x=>x!==i):a.sel.push(i);
    render();
  });
  document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.mv,d=+b.dataset.d,arr=a.order;
    [arr[i],arr[i+d]]=[arr[i+d],arr[i]];render();
  });
  document.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{a.subs[+b.dataset.sub]=b.dataset.val==="true";render();});
  document.querySelectorAll("[data-hot]").forEach(sel=>sel.onchange=()=>{a.hot[+sel.dataset.hot]=sel.value===""?undefined:+sel.value;render();});
  document.querySelectorAll("[data-conf]").forEach(b=>b.onclick=()=>{a.conf=b.dataset.conf;toast(T("q_confset")+b.textContent);});
  const f=document.getElementById("flagq");
  if(f)f.onclick=()=>{const r=qrec(q.id);r.flag=!r.flag;save();render();};
  const c=document.getElementById("check");
  if(c)c.onclick=()=>{
    if(!answered(q,a)){toast(T("q_answerall"));return;}
    commit(q,a);SES.revealed=true;render();
  };
  const n=document.getElementById("next");
  if(n)n.onclick=()=>{
    SES.revealed=false;
    if(SES.i<SES.list.length-1){SES.i++;render();}else{SES.done=true;render();}
  };
  const nt=document.getElementById("notethis");
  if(nt)nt.onclick=()=>{const b=document.getElementById("notebox");b.style.display=b.style.display==="none"?"block":"none";};
  const sn=document.getElementById("savenote");
  if(sn)sn.onclick=()=>{const v=document.getElementById("noteta").value.trim();
    if(v)S().notes[q.o]=v;else delete S().notes[q.o];save();toast(T("ref_saved"));};
}
function commit(q,a){
  const ok=isCorrect(q,a),r=qrec(q.id);
  r.seen++;ok?r.ok++:r.ko++;r.last=today();r.conf=a.conf||r.conf;
  schedule(r,ok);
  SES.res[q.id]=ok;
  markStreak();save();
}

function pickExam(n){
  const out=[];

    const k=Math.max(1,Math.round(n*d.w/100));
    out.push(...shuffle(allQuestions().filter(q=>domOf(q)===d.id)).slice(0,k));
  });
  return shuffle(out);
}

function finishExam(){
  clearInterval(TICK);
  SES.list.forEach(q=>{const a=getAns(q);const ok=isCorrect(q,a);SES.res[q.id]=ok;
    const r=qrec(q.id);r.seen++;ok?r.ok++:r.ko++;r.last=today();schedule(r,ok);});
  const byDom={};
  REFERENTIEL.forEach(d=>{
    const qs=SES.list.filter(q=>domOf(q)===d.id);
    byDom[d.id]=qs.length?Math.round(qs.filter(q=>SES.res[q.id]).length/qs.length*100):0;
  });
  const ok=Object.values(SES.res).filter(Boolean).length;
  SES.score=Math.round(ok/SES.list.length*1000);
  SES.byDom=byDom;SES.done=true;SES.paused=false;
  S().exams.push({d:today(),score:SES.score,byDom,n:SES.list.length,secs:SES.dur-timeLeft()});
  markStreak();save();render();
}
function abandonExam(){clearInterval(TICK);SES=null;toast(T("e_abandoned"));render();}
function examReport(){
  const pass=SES.score>=700;
  let h=`<div class="head"><div><div class="eyebrow">${T("e_result")}</div>
    <h1 style="color:${pass?"var(--grant)":"var(--block)"}">${SES.score} / 1000</h1>
    <div class="sub">${pass?T("e_pass"):T("e_fail")}</div></div></div>
  <div class="card"><h2>${T("d_bydom")}</h2>${REFERENTIEL.map(d=>{const v=SES.byDom[d.id]||0;
    return `<div class="dom-line"><div><div class="n">${d.id} · ${esc(refDom(d).title)} <span class="w">(${d.range})</span></div>
    <div class="bar" style="margin-top:5px"><i class="${v>=70?"grant":v>=50?"signal":"block"}" style="width:${v}%"></i></div></div><div class="p">${v}%</div></div>`;}).join("")}</div>
  <div class="card"><h2>${T("e_correction")}</h2>`;
  SES.list.forEach((q,i)=>{
    const ok=SES.res[q.id],lq=locQ(q);
    h+=`<details><summary><span class="chip ${ok?"grant":"block"}">${ok?T("e_right"):T("e_wrong")}</span> ${i+1}. ${esc(lq.q.slice(0,100))}${lq.q.length>100?"…":""}</summary>
      ${renderQuestion(q,true,{noActions:true})}</details>`;
  });
  h+=`</div><div class="row" style="margin-top:14px"><button class="btn key" id="newex">${T("e_newex")}</button>
    <button class="btn ghost" id="exko">${T("e_reviewko")}</button></div>`;
  return h;
}
function bindExam(){
  const ab=document.getElementById("abandon");
  if(ab)ab.onclick=()=>{if(confirm(T("e_confirm_ab")))abandonExam();};
  const fi=document.getElementById("fin");
  if(fi)fi.onclick=()=>{if(confirm(T("e_confirm_end")))finishExam();};
  if(SES&&SES.exam&&!SES.done&&SES.paused){
    document.getElementById("resume").onclick=()=>resumeExam();
    return;
  }
  if(SES&&SES.exam&&!SES.done){
    bindQuestion(SES.list[SES.i],false);
    document.getElementById("prev").onclick=()=>{SES.i--;render();};
    document.getElementById("nx").onclick=()=>{if(SES.i<SES.list.length-1){SES.i++;render();}else finishExam();};
    document.getElementById("pause").onclick=()=>pauseExam();
    return;
  }
  if(SES&&SES.exam&&SES.done){
    document.getElementById("newex").onclick=()=>{SES=null;render();};
    document.getElementById("exko").onclick=()=>{const bad=SES.list.filter(q=>!SES.res[q.id]);SES=null;
      if(!bad.length){toast(T("e_nomiss"));return;}startSession(bad,{});go("train");};
    return;
  }
  const b=document.getElementById("startex");
  if(b)b.onclick=()=>{
    const n=+document.getElementById("en").value,d=+document.getElementById("ed").value;
    startSession(pickExam(n),{exam:true,dur:d*60});
  };
}

    ${grp("grant",T("ca_grant"))}
    <div style="margin-top:12px"><div class="eyebrow">${T("ca_mode")}</div>
      <div class="seg" style="margin-top:6px">${[["all",T("ca_all")],["one",T("ca_one")]].map(([v,t])=>
        `<button data-mode="${v}" class="${CAS.cfg.mode===v?"on":""}" ${CAS.rev?"disabled":""}>${t}</button>`).join("")}</div></div>
    ${grp("sess",T("ca_sess"))}
    <div class="row" style="margin-top:18px">
      ${CAS.rev?`<button class="btn key" id="canext">${T("ca_nextsc")}</button><button class="btn ghost" id="caretry">${T("ca_retry")}</button>`
      :`<button class="btn key" id="cacheck">${T("ca_check")}</button><button class="btn ghost" id="careset">${T("ca_reset")}</button>`}
    </div>`;
  if(CAS.rev){
    const keys=["users","excl","apps","cond","grant","sess"];
    const ok=keys.every(k=>(sc0.t[k]||[]).slice().sort().join()===CAS.cfg[k].slice().sort().join())&&sc0.t.mode===CAS.cfg.mode;
    h+=`<div class="why ${ok?"":"ko"}" style="margin-top:16px"><h4>${ok?T("ca_conform"):T("ca_gaps")}</h4>${esc(sc.why)}
      ${sc0.t.mode!==CAS.cfg.mode?`<div style="margin-top:6px">${sc0.t.mode==="all"?T("ca_modeall"):T("ca_modeone")}</div>`:""}</div>`;
  }
  h+=`</div>`;
  return h;
}
function bindCa(){
  const sel=document.getElementById("scsel");
  if(sel)sel.onchange=()=>{CAS={sc:+sel.value,cfg:newCfg(),rev:false};render();};
  document.querySelectorAll("[data-ca]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.ca,i=+b.dataset.i,arr=CAS.cfg[k];
    arr.includes(i)?CAS.cfg[k]=arr.filter(x=>x!==i):arr.push(i);render();
  });
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{CAS.cfg.mode=b.dataset.mode;render();});
  const c=document.getElementById("cacheck");
  if(c)c.onclick=()=>{CAS.rev=true;markStreak();save();render();};
  const r=document.getElementById("careset");
  if(r)r.onclick=()=>{CAS.cfg=newCfg();render();};
  const rt=document.getElementById("caretry");
  if(rt)rt.onclick=()=>{CAS.cfg=newCfg();CAS.rev=false;render();};
  const n=document.getElementById("canext");
  if(n)n.onclick=()=>{CAS={sc:(CAS.sc+1)%CA_SCENARIOS.length,cfg:newCfg(),rev:false};render();};
}

/* =====================================================================
   VUE — MES QUESTIONS
   ===================================================================== */
function viewEdit(){
  const s=S();
  let h=`<div class="head"><div><div class="eyebrow">${T("ed_eyebrow")}</div><h1>${T("r_edit")}</h1>
    <div class="sub">${T("ed_sub")}</div></div></div>
  <div class="card"><h2>${T("ed_new")}</h2>
    <div class="grid g2" style="margin-top:10px">
      <div><label class="eyebrow">${T("t_objective")}</label><select id="nobj">
        ${Object.values(OBJ_INDEX).map(o=>`<option value="${o.id}">${o.id} — ${esc(refObj(o.id,o.label).slice(0,50))}</option>`).join("")}</select></div>
      <div><label class="eyebrow">${T("ed_type")}</label><select id="ntype"><option value="single">${T("q_single")}</option><option value="multi">${T("q_multi")}</option></select></div>
    </div>
    <div style="margin-top:10px"><label class="eyebrow">${T("ed_stem")}</label><textarea id="nq" placeholder="${T("ed_stemph")}"></textarea></div>
    <div style="margin-top:10px"><label class="eyebrow">${T("ed_opts")}</label>
      <textarea id="nopts" placeholder="*..."></textarea></div>
    <div style="margin-top:10px"><label class="eyebrow">${T("ed_why")}</label><textarea id="nwhy"></textarea></div>
    <button class="btn key" id="addq" style="margin-top:12px">${T("ed_add")}</button></div>`;
  h+=`<div class="card"><h2>${T("ed_mine",s.custom.length)}</h2>`;
  if(!s.custom.length)h+=`<div class="empty small">${T("ed_none")}</div>`;
  else h+=s.custom.map(q=>`<div class="obj"><div><div class="t"><span class="id">${q.o}</span>${esc(q.q.slice(0,120))}</div>
    <div class="small muted" style="margin-top:3px">${q.opts.map((o,i)=>(q.a.includes(i)?"✓ ":"· ")+esc(o)).join(" &nbsp; ")}</div></div>
    <button class="btn sm ghost" data-delq="${q.id}">${T("c_del")}</button></div>`).join("");
  return h+`</div>`;
}
function bindEdit(){
  const b=document.getElementById("addq");
  if(b)b.onclick=()=>{
    const q=document.getElementById("nq").value.trim();
    const lines=document.getElementById("nopts").value.split("\n").map(x=>x.trim()).filter(Boolean);
    if(!q||lines.length<2){toast(T("ed_need"));return;}
    const a=[],opts=lines.map((l,i)=>{if(l.charAt(0)==="*"){a.push(i);return l.slice(1).trim();}return l;});
    if(!a.length){toast(T("ed_needa"));return;}
    S().custom.push({id:"u"+Date.now(),o:document.getElementById("nobj").value,t:document.getElementById("ntype").value,
      q,opts,a,why:document.getElementById("nwhy").value.trim()||T("ed_own"),ko:{}});
    save();toast(T("ed_added"));render();
  };
  document.querySelectorAll("[data-delq]").forEach(x=>x.onclick=()=>{
    S().custom=S().custom.filter(q=>q.id!==x.dataset.delq);save();render();});
}

/* =====================================================================
   VUE — DONNÉES ET RÉGLAGES
   ===================================================================== */
function viewData(){
  const s=S();
  const size=(()=>{try{return Math.round(JSON.stringify(s).length/1024)+" Ko";}catch(e){return "—";}})();
  const untr=allQuestions().filter(q=>!EN.q[q.id]).length;
  return `<div class="head"><div><div class="eyebrow">${T("dt_eyebrow")}</div><h1>${T("r_data")}</h1>
    <div class="sub">${T("dt_sub")}</div></div></div>
  <div class="card"><h2>${T("dt_backup")}</h2>
    <div class="row" style="margin-top:10px">
      <button class="btn key" id="exp">${T("dt_exp")}</button>
      <button class="btn ghost" id="expq">${T("dt_expq")}</button>
      <label class="btn ghost" style="cursor:pointer">${T("dt_imp")}<input type="file" id="imp" accept="application/json" style="display:none"></label>
    </div>
    <p class="small muted" style="margin-top:10px">${T("dt_state",PERSIST?T("dt_on"):T("dt_off"),size,Object.keys(s.q).length)}</p></div>
  <div class="card"><h2>${T("dt_display")}</h2>
    <div class="row" style="margin-top:10px"><span class="small muted" style="min-width:80px">${T("lang_label")}</span>
      <div class="seg">${[["fr","Français"],["en","English"]].map(([v,t])=>`<button data-lang2="${v}" class="${LANG===v?"on":""}">${t}</button>`).join("")}</div></div>
    <div class="row" style="margin-top:12px"><span class="small muted" style="min-width:80px">${T("dt_theme")}</span>
      <div class="seg">${[["light",T("dt_light")],["dark",T("dt_dark")]].map(([v,t])=>`<button data-theme="${v}" class="${s.theme===v?"on":""}">${t}</button>`).join("")}</div></div>
    <div class="row" style="margin-top:12px"><span class="small muted" style="min-width:80px">${T("d_examdate")}</span>
      <input type="date" id="exd2" value="${s.examDate||""}" style="max-width:200px"></div>
    ${untr?`<p class="small muted" style="margin-top:12px">${T("dt_untranslated_t",untr)}</p>`:""}</div>
  <div class="card"><h2>${T("dt_reset")}</h2>
    <p class="small muted">${T("dt_resetwarn")}</p>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost" id="rsq">${T("dt_rsq")}</button>
      <button class="btn ghost" id="rsc">${T("dt_rsc")}</button>
      <button class="btn ghost" id="rsall" style="border-color:var(--block);color:var(--block)">${T("dt_rsall")}</button></div></div>
  <div class="card"><h2>${T("dt_content")}</h2>
    <table><tbody>
      <tr><td>${T("dt_objs")}</td><td class="mono">${Object.keys(OBJ_INDEX).length}</td></tr>
      <tr><td>${T("dt_qs")}</td><td class="mono">${T("dt_personal",QUESTIONS.length,s.custom.length)}</td></tr>
      <tr><td>${T("dt_cards")}</td><td class="mono">${CARTES.length}</td></tr>
      <tr><td>${T("dt_comp")}</td><td class="mono">${COMPARATEURS.length}</td></tr>
      <tr><td>${T("dt_cmd")}</td><td class="mono">${CMDLETS.length}</td></tr>
      <tr><td>${T("dt_kql")}</td><td class="mono">${KQL.length}</td></tr>
      <tr><td>${T("dt_labs")}</td><td class="mono">${LABS.length}</td></tr>
      <tr><td>${T("dt_ca")}</td><td class="mono">${CA_SCENARIOS.length}</td></tr>
    </tbody></table></div>`;
}
function download(name,obj){
  const b=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function bindData(){
  const g=id=>document.getElementById(id);
  if(g("exp"))g("exp").onclick=()=>download(`sc300-progression-${today()}.json`,S());
  if(g("expq"))g("expq").onclick=()=>download(`sc300-questions-${today()}.json`,{custom:S().custom});
  if(g("imp"))g("imp").onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(d.custom&&!d.q){S().custom=S().custom.concat(d.custom.filter(x=>!S().custom.some(y=>y.id===x.id)));toast(T("dt_imported",d.custom.length));}
        else{MEM=Object.assign(DEF(),d);LANG=MEM.lang||"fr";toast(T("dt_restored"));}
        save();applyTheme();render();
      }catch(err){toast(T("dt_badfile"));}
    };
    r.readAsText(f);
  };
  document.querySelectorAll("[data-lang2]").forEach(b=>b.onclick=()=>setLang(b.dataset.lang2));
  document.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{S().theme=b.dataset.theme;save();applyTheme();render();});
  if(g("exd2"))g("exd2").onchange=()=>{S().examDate=g("exd2").value;save();toast(T("dt_datesaved"));};
  if(g("rsq"))g("rsq").onclick=()=>{if(confirm(T("dt_cq"))){S().q={};S().sess=[];S().exams=[];save();render();}};
  if(g("rsc"))g("rsc").onclick=()=>{if(confirm(T("dt_cc"))){S().cards={};save();render();}};
  if(g("rsall"))g("rsall").onclick=()=>{if(confirm(T("dt_ca"))){const l=LANG;MEM=DEF();MEM.lang=l;save();applyTheme();render();}};
}

/* =====================================================================
   RENDU
   ===================================================================== */
const VIEWS={dash:[viewDash,bindDash],ref:[viewRef,bindRef],carnet:[viewCarnet,bindCarnet],
 train:[viewTrain,bindTrain],exam:[viewExam,bindExam],cards:[viewCards,bindCards],
 comp:[viewComp,null],lic:[viewLic,null],glo:[viewGlo,null],labs:[viewLabs,bindLabs],
 kql:[viewKql,bindKql],ps:[viewPs,bindPs],ca:[viewCa,bindCa],edit:[viewEdit,bindEdit],data:[viewData,bindData]};
function applyTheme(){document.documentElement.setAttribute("data-theme",S().theme||"light");}
function render(){
  const [v,b]=VIEWS[route]||VIEWS.dash;
  document.getElementById("view").innerHTML=v();
  buildNav();
  if(b)b();
}
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea,select"))return;
  if(SES&&!SES.done&&!SES.exam){
    const q=SES.list[SES.i];
    if(!SES.revealed&&q.t==="single"&&/^[1-9]$/.test(e.key)){
      const i=+e.key-1;if(q.opts[i]){getAns(q).sel=[i];render();}
    }
    if(e.key==="Enter"){const c=document.getElementById("check")||document.getElementById("next");if(c)c.click();}
  }
  if(SES&&SES.exam&&!SES.done&&e.key==="Escape"){SES.paused?resumeExam():pauseExam();}
});
load();LANG=S().lang||"fr";
document.documentElement.setAttribute("lang",LANG);
document.title=LANG==="en"?"Access desk — SC-300 preparation":"Poste d'habilitation — Préparation SC-300";
applyTheme();render();
</script>
