<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poste d'habilitation — Préparation SC-300</title>
<style>
:root{
  --paper:#EDEFF3; --card:#FFFFFF; --card-2:#F6F7FA;
  --ink:#15161C; --ink-2:#4A505E; --ink-3:#78808F;
  --line:#D7DBE3; --line-2:#E7EAF0;
  --key:#3D3A7A; --key-soft:#EAE9F5;
  --grant:#1B7268; --grant-soft:#E2F0ED;
  --block:#A93348; --block-soft:#F8E6E9;
  --signal:#9C6B0A; --signal-soft:#FAF0DC;
  --shadow:0 1px 2px rgba(21,22,28,.06),0 8px 24px -12px rgba(21,22,28,.18);
  --r:10px; --r-s:6px;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono","Consolas","Liberation Mono",monospace;
  --sans:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
}
[data-theme="dark"]{
  --paper:#101218; --card:#171A22; --card-2:#1D212B;
  --ink:#E8EAF0; --ink-2:#AAB2C2; --ink-3:#7A8496;
  --line:#2A2F3B; --line-2:#232833;
  --key:#A5A0E8; --key-soft:#22233A;
  --grant:#5FC3B4; --grant-soft:#122824;
  --block:#E8899A; --block-soft:#2A161B;
  --signal:#E0B458; --signal-soft:#2A2213;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--key)}
.eyebrow{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600;
}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:22px}
h2{font-size:17px}
h3{font-size:14px}
.mono{font-family:var(--mono)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{
  background:var(--card); border-right:1px solid var(--line);
  padding:18px 12px 40px; position:sticky; top:0; height:100vh; overflow:auto;
}
.brand{padding:4px 10px 16px;border-bottom:1px solid var(--line-2);margin-bottom:12px}
.brand .t{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.06em}
.brand .s{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.navgroup{margin:14px 0 6px;padding:0 10px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;padding:7px 10px;border-radius:var(--r-s);
  color:var(--ink-2);cursor:pointer;font-size:13.5px;
}
.nav button:hover{background:var(--card-2);color:var(--ink)}
.nav button.on{background:var(--key-soft);color:var(--key);font-weight:600}
.nav .ic{width:16px;text-align:center;font-family:var(--mono);font-size:12px;opacity:.85}
.nav .badge{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--signal-soft);color:var(--signal);padding:1px 5px;border-radius:20px}
main{padding:26px 30px 80px;max-width:1080px}
.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.head .sub{color:var(--ink-2);font-size:13.5px;margin-top:3px;max-width:70ch}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.btn{
  background:var(--ink);color:var(--paper);border:1px solid var(--ink);
  padding:8px 14px;border-radius:var(--r-s);cursor:pointer;font-size:13.5px;font-weight:550;
}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--card-2)}
.btn.key{background:var(--key);border-color:var(--key);color:#fff}
[data-theme="dark"] .btn.key{color:#12131A}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{
  display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:20px;
  border:1px solid var(--line);color:var(--ink-2);background:var(--card-2);white-space:nowrap;
}
.chip.grant{background:var(--grant-soft);color:var(--grant);border-color:transparent}
.chip.block{background:var(--block-soft);color:var(--block);border-color:transparent}
.chip.signal{background:var(--signal-soft);color:var(--signal);border-color:transparent}
.chip.key{background:var(--key-soft);color:var(--key);border-color:transparent}
input[type=text],input[type=date],input[type=number],select,textarea{
  background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-s);
  padding:7px 9px;width:100%;
}
textarea{min-height:80px;resize:vertical;font-family:var(--sans)}
:focus-visible{outline:2px solid var(--key);outline-offset:2px}
.bar{height:6px;background:var(--line-2);border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--key);border-radius:20px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.bar i.grant{background:var(--grant)} .bar i.signal{background:var(--signal)} .bar i.block{background:var(--block)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
tbody tr:hover{background:var(--card-2)}
code{font-family:var(--mono);font-size:12.5px;background:var(--card-2);border:1px solid var(--line-2);padding:1px 5px;border-radius:4px}
pre{font-family:var(--mono);font-size:12.5px;background:var(--card-2);border:1px solid var(--line-2);padding:10px;border-radius:var(--r-s);overflow:auto;margin:8px 0}
hr{border:0;border-top:1px solid var(--line-2);margin:14px 0}

/* ---------- signature: jauge de posture ---------- */
.posture{display:flex;gap:18px;align-items:center}
.gauge{position:relative;width:132px;height:132px;flex:none}
.gauge svg{transform:rotate(-90deg)}
.gauge .val{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.gauge .val b{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
.gauge .val span{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;margin-top:4px}
.dom-line{display:grid;grid-template-columns:1fr 46px;gap:10px;align-items:center;margin:9px 0}
.dom-line .n{font-size:13px}
.dom-line .w{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.dom-line .p{font-family:var(--mono);font-size:12.5px;text-align:right}

/* ---------- heatmap ---------- */
.heat{display:flex;flex-wrap:wrap;gap:4px}
.heat i{width:15px;height:15px;border-radius:3px;background:var(--line-2);display:block;cursor:help}
.heat i[data-l="1"]{background:var(--block-soft);box-shadow:inset 0 0 0 1px var(--block)}
.heat i[data-l="2"]{background:var(--signal-soft);box-shadow:inset 0 0 0 1px var(--signal)}
.heat i[data-l="3"]{background:var(--grant-soft);box-shadow:inset 0 0 0 1px var(--grant)}
.heat i[data-l="4"]{background:var(--grant)}

/* ---------- quiz ---------- */
.qcard{max-width:820px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.qtext{font-size:16px;line-height:1.5;margin:6px 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);
  border-radius:var(--r-s);background:var(--card);cursor:pointer;text-align:left;width:100%;font-size:14px;line-height:1.45;
}
.opt:hover{border-color:var(--key)}
.opt .k{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding-top:2px;flex:none;width:14px}
.opt.sel{border-color:var(--key);background:var(--key-soft)}
.opt.ok{border-color:var(--grant);background:var(--grant-soft)}
.opt.ko{border-color:var(--block);background:var(--block-soft)}
.opt.miss{border-color:var(--grant);border-style:dashed}
.opt[disabled]{cursor:default}
.why{margin-top:14px;border-left:3px solid var(--grant);background:var(--grant-soft);padding:11px 13px;border-radius:0 var(--r-s) var(--r-s) 0;font-size:13.5px}
.why.ko{border-color:var(--block);background:var(--block-soft)}
.why h4{margin:0 0 5px;font-size:12px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase}
.why ul{margin:8px 0 0;padding-left:18px}
.why li{margin:3px 0}
.conf{display:flex;gap:6px}
.progressline{display:flex;gap:3px;margin-bottom:16px;flex-wrap:wrap}
.progressline i{width:100%;max-width:22px;height:4px;border-radius:2px;background:var(--line-2);flex:1}
.progressline i.ok{background:var(--grant)} .progressline i.ko{background:var(--block)} .progressline i.cur{background:var(--key)}
.orderlist{display:flex;flex-direction:column;gap:6px}
.orderitem{display:flex;gap:8px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--card);font-size:13.5px}
.orderitem .num{font-family:var(--mono);font-size:11px;color:var(--ink-3);width:16px}
.orderitem .mv{margin-left:auto;display:flex;gap:4px}
.orderitem button{background:var(--card-2);border:1px solid var(--line);border-radius:4px;width:24px;height:22px;cursor:pointer;font-size:11px;line-height:1}
.hot{display:grid;gap:8px}
.hot .r{display:grid;grid-template-columns:1fr 220px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}

/* ---------- misc ---------- */
.timer{font-family:var(--mono);font-size:15px;font-weight:600}
.timer.warn{color:var(--block)}
.obj{border-bottom:1px solid var(--line-2);padding:9px 0;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.obj:last-child{border-bottom:0}
.obj .t{font-size:13.5px}
.obj .id{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-right:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.seg button{background:var(--card);border:0;border-right:1px solid var(--line);padding:4px 9px;font-size:11.5px;cursor:pointer;color:var(--ink-2);font-family:var(--mono)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--paper)}
.seg button.on[data-v="ok"]{background:var(--grant);color:#fff}
.seg button.on[data-v="ko"]{background:var(--block);color:#fff}
.seg button.on[data-v="mid"]{background:var(--signal);color:#fff}
details{border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;margin:8px 0;background:var(--card)}
details summary{cursor:pointer;font-weight:600;font-size:13.5px}
details[open] summary{margin-bottom:8px}
.kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink-2)}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:9px 16px;border-radius:20px;font-size:13px;z-index:99;box-shadow:var(--shadow);
}
.empty{text-align:center;padding:34px 18px;color:var(--ink-2)}
.empty h3{margin-bottom:6px}
.tabbar{display:none}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px 12px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .nav button{width:auto}
  main{padding:18px 14px 90px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .hot .r{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.rail{display:none}.app{grid-template-columns:1fr}}
</style>
</head>

 opts:["Même un administrateur général doit se voir attribuer un rôle dédié aux attributs pour les lire ou les définir","Ils sont visibles par tous les administrateurs par défaut","Ils remplacent les attributs d'extension de schéma","Ils ne peuvent pas servir dans les règles d'appartenance dynamique"],
 a:[0],why:"Les attributs de sécurité personnalisés sont volontairement cloisonnés : il faut les rôles Administrateur de définition d'attributs ou Administrateur d'affectation d'attributs, y compris pour un administrateur général.",
 ko:{1:"C'est justement l'inverse, l'accès est refusé par défaut.",2:"Les deux mécanismes coexistent pour des usages différents.",3:"Ils sont exploitables pour cibler et filtrer, notamment en accès conditionnel."}},
{id:"q008",o:"1.3.1",t:"single",q:"Vous devez empêcher les utilisateurs standard d'inviter des externes, tout en autorisant une petite équipe partenariats à le faire. Quelle configuration ?",
 opts:["Dans les paramètres de collaboration externe, restreindre les invitations aux rôles d'administrateur et attribuer le rôle Inviteur d'invités à l'équipe","Bloquer complètement la collaboration B2B","Créer une unité administrative pour les invités","Passer par un package d'accès pour toute invitation"],
 a:[0],why:"Les paramètres de collaboration externe permettent de restreindre qui peut inviter, et le rôle Inviteur d'invités accorde exactement cette capacité sans autre privilège.",
 ko:{1:"Le besoin est de conserver la collaboration pour une équipe.",2:"Une unité administrative délimite un périmètre d'administration, pas le droit d'inviter.",3:"Un package d'accès est une bonne pratique de gouvernance, mais il ne règle pas à lui seul qui détient le droit d'invitation."}},
{id:"q009",o:"1.3.4",t:"single",q:"Vos invités du tenant partenaire ont déjà réalisé un MFA dans leur propre organisation, mais Entra le leur redemande. Comment supprimer cette double demande ?",
 opts:["Dans les paramètres d'accès entre locataires, activer l'approbation des revendications MFA en entrée pour ce partenaire","Exclure les invités des stratégies d'accès conditionnel","Créer une stratégie d'accès conditionnel qui n'exige jamais le MFA pour les invités","Convertir les invités en membres"],
 a:[0],why:"Les paramètres d'accès entre locataires permettent d'approuver le MFA effectué dans le tenant d'origine, ce qui évite la double authentification sans affaiblir l'exigence.",
 ko:{1:"Exclure les invités des stratégies supprime la protection.",2:"Cela revient à renoncer au MFA pour toute une population.",3:"Changer le type d'utilisateur ne modifie pas l'authentification et augmente les permissions par défaut."}},
{id:"q010",o:"1.3.5",t:"single",q:"Deux entités du groupe fusionnent. Les utilisateurs du tenant A doivent apparaître automatiquement comme invités dans le tenant B et rester à jour. Quelle solution ?",
 opts:["Synchronisation entre locataires configurée en sortie sur le tenant A et acceptée en entrée sur le tenant B","Entra Connect Sync entre les deux tenants","Invitation en masse par fichier CSV","Fédération directe SAML entre les deux tenants"],
 a:[0],why:"La synchronisation entre locataires provisionne et maintient automatiquement les objets B2B d'un tenant vers l'autre, y compris les mises à jour et les suppressions.",
 ko:{1:"Entra Connect synchronise depuis Active Directory sur site, pas entre deux tenants.",2:"Le CSV est ponctuel et ne maintient rien dans le temps.",3:"La fédération directe s'adresse à des domaines externes non gérés par Entra."}},
{id:"q011",o:"1.4.3",t:"multi",q:"L'organisation veut que l'authentification continue de fonctionner si la connectivité vers le site tombe, et souhaite être alertée des identifiants divulgués. Quelles décisions retenez-vous ? (deux réponses)",
 opts:["Activer la synchronisation de hachage de mot de passe","Conserver l'authentification directe comme unique méthode","Activer PHS comme secours même en cas de fédération","Basculer sur AD FS"],
 a:[0,2],why:"La synchronisation de hachage est la seule méthode qui rend l'authentification indépendante des serveurs sur site, et c'est aussi le prérequis du rapport sur les identifiants divulgués.",
 ko:{1:"L'authentification directe dépend d'agents sur site : si le lien tombe, l'authentification échoue.",3:"AD FS ajoute une dépendance supplémentaire et va à l'encontre de l'objectif."}},
{id:"q012",o:"1.4.2",t:"single",q:"Après plusieurs rachats, vous devez synchroniser trois forêts Active Directory sans connectivité entre elles vers un même tenant, avec une empreinte serveur minimale. Quel outil ?",
 opts:["Microsoft Entra Cloud Sync","Microsoft Entra Connect Sync","Microsoft Entra Connect Health","Synchronisation entre locataires"],
 a:[0],why:"Cloud Sync repose sur des agents légers pilotés depuis le cloud et prend en charge des forêts déconnectées, ce qui est exactement le scénario de fusion-acquisition.",
 ko:{1:"Connect Sync suppose une connectivité vers toutes les forêts depuis un serveur unique et une configuration plus lourde.",2:"Connect Health est un outil de surveillance, il ne synchronise rien.",3:"Elle relie deux tenants, pas des forêts AD."}},
{id:"q013",o:"1.4.5",t:"yesno",q:"L'authentification unique fluide (Seamless SSO) est en cours de déploiement. Chaque affirmation est-elle vraie ?",
 subs:[
  {s:"Un objet ordinateur AZUREADSSOACC est créé dans Active Directory","a":true,why:"C'est le compte qui porte la clé de déchiffrement Kerberos utilisée pour le SSO."},
  {s:"La clé de déchiffrement Kerberos doit être renouvelée régulièrement","a":true,why:"Microsoft recommande une rotation périodique, faute de quoi le SSO cesse de fonctionner."},
  {s:"Le SSO fluide fonctionne sur des appareils joints à Entra ID uniquement dans le cloud","a":false,why:"Il s'adresse aux appareils joints au domaine sur site ; les appareils joints à Entra utilisent le jeton d'actualisation principal."},
  {s:"L'URL du service doit figurer dans la zone Intranet du navigateur","a":true,why:"Sans cela, le navigateur ne transmet pas le ticket Kerberos automatiquement."}
 ]},
{id:"q014",o:"1.2.4",t:"single",q:"Vous devez créer 400 comptes à partir d'un export RH, de façon reproductible et scriptable. Quelle approche correspond le mieux à l'attendu de l'examen ?",
 opts:["Un script Microsoft Graph PowerShell qui parcourt le CSV et appelle New-MgUser","Le module AzureAD PowerShell avec New-AzureADUser","La création manuelle dans le centre d'administration","Une règle d'appartenance dynamique"],
 a:[0],why:"Microsoft Graph PowerShell est le module actuel ; l'import en masse du portail existe aussi mais le scénario demande de la reproductibilité.",
 ko:{1:"Les modules AzureAD et MSOnline sont dépréciés.",2:"Ingérable à cette volumétrie et non reproductible.",3:"Une règle dynamique remplit un groupe, elle ne crée pas de comptes."}},
{id:"q015",o:"1.1.7",t:"single",q:"Vous voulez empêcher les utilisateurs standard d'enregistrer de nouvelles applications dans le tenant. Où agissez-vous ?",
 opts:["Paramètres utilisateur du tenant, option d'inscription d'applications","Paramètres de collaboration externe","Stratégie de méthodes d'authentification","Paramètres d'appareils"],
 a:[0],why:"Le paramètre « Les utilisateurs peuvent inscrire des applications » se règle dans les paramètres utilisateur du tenant, et passe alors le droit aux seuls rôles adéquats.",
 ko:{1:"Ces paramètres concernent les invités.",2:"Sans rapport avec les inscriptions.",3:"Ils gouvernent la jointure et l'enregistrement des appareils."}},
{id:"q016",o:"1.4.7",t:"single",q:"Vous voulez être alerté si un agent de synchronisation cesse d'exporter vers le tenant. Quelle brique utilisez-vous ?",
 opts:["Microsoft Entra Connect Health","Le journal de provisioning","Identity Secure Score","Les paramètres de diagnostic Entra"],
 a:[0],why:"Connect Health surveille les agents de synchronisation, d'authentification directe et AD FS, et déclenche des alertes sur les défauts d'export.",
 ko:{1:"Le journal de provisioning trace le provisioning applicatif et cross-tenant.",2:"Il évalue la posture de sécurité, sans lien avec la santé des agents.",3:"Ils routent les journaux, ils n'apportent pas d'alertes de santé prêtes à l'emploi."}},
{id:"q017",o:"1.1.4",t:"single",q:"Un administrateur affirme ne pas pouvoir modifier un utilisateur alors qu'il détient un rôle qui l'autorise. Quelle vérification est la plus pertinente en premier ?",
 opts:["Vérifier le périmètre de l'attribution : rôle limité à une unité administrative, ou objet cible dans une unité à gestion restreinte","Vérifier la licence de l'utilisateur cible","Vérifier l'appartenance au groupe Global Administrators","Vérifier la stratégie de mot de passe"],
 a:[0],why:"Une attribution de rôle a toujours un périmètre : tenant, unité administrative ou objet unique. Les unités à gestion restreinte bloquent en plus les administrateurs hors périmètre.",
 ko:{1:"Les licences ne conditionnent pas l'administration de l'objet.",2:"Le besoin n'est pas de donner plus de droits mais de comprendre le refus.",3:"Sans rapport avec un refus de modification d'objet."}},

/* ---------------- D2 · authentification et accès ---------------- */
{id:"q018",o:"2.1.3",t:"single",q:"Un nouvel arrivant doit s'inscrire à une passkey le jour de son arrivée, sans jamais recevoir de mot de passe initial par courriel. Quelle méthode utilisez-vous ?",
 opts:["Générer un Temporary Access Pass à usage unique","Créer un mot de passe temporaire à changer à la première connexion","Envoyer un code par SMS","Attribuer un jeton OATH matériel"],
 a:[0],why:"Le Temporary Access Pass est conçu pour l'amorçage sans mot de passe : il permet de s'authentifier une fois pour inscrire une méthode forte.",
 ko:{1:"Cela suppose justement un mot de passe, ce que le scénario exclut.",2:"Le SMS est faible et ne permet pas d'inscrire une passkey de manière fiable.",3:"Le jeton doit lui aussi être activé par une authentification préalable."}},
{id:"q019",o:"2.2.4",t:"single",q:"Une stratégie d'accès conditionnel exige « Nécessiter l'authentification multifacteur » ET « Nécessiter que l'appareil soit marqué comme conforme », avec l'option « Exiger tous les contrôles sélectionnés ». Que se passe-t-il pour un utilisateur ayant fait le MFA sur un appareil non conforme ?",
 opts:["L'accès est bloqué car les deux contrôles doivent être satisfaits","L'accès est accordé car un contrôle suffit","L'utilisateur est invité à enregistrer son appareil puis obtient l'accès","La stratégie est ignorée faute de contrôle applicable"],
 a:[0],why:"Avec « Exiger tous les contrôles sélectionnés », les contrôles se combinent en ET : un seul non satisfait entraîne le blocage.",
 ko:{1:"C'est le comportement de l'option « Exiger un des contrôles sélectionnés ».",2:"Aucune remédiation automatique de conformité n'est offerte par l'accès conditionnel.",3:"La stratégie s'applique bien, elle échoue simplement sur un contrôle."}},
{id:"q020",o:"2.2.5",t:"single",q:"Un directeur est bloqué à la connexion et vous devez identifier la stratégie responsable, sans reproduire la connexion. Quel outil ?",
 opts:["Le détail Accès conditionnel de l'entrée correspondante dans les journaux de connexion","L'outil What If","Identity Secure Score","Le journal d'audit"],
 a:[0],why:"Le journal de connexion conserve, pour chaque tentative, la liste des stratégies évaluées avec leur résultat : appliquée, échouée, non appliquée.",
 ko:{1:"What If simule une connexion hypothétique ; c'est utile en amont, mais l'événement réel est déjà tracé.",2:"C'est un indicateur de posture globale.",3:"Il trace les modifications d'objets, pas les décisions d'authentification."}},
{id:"q021",o:"2.2.1",t:"single",q:"Vous déployez une stratégie qui exige le MFA pour tous les utilisateurs. Quelle précaution est indispensable ?",
 opts:["Exclure au moins deux comptes de secours (break-glass) et démarrer la stratégie en mode rapport seul","Exclure le rôle Administrateur général en permanence","Activer d'abord les paramètres de sécurité par défaut","Appliquer la stratégie aux invités uniquement"],
 a:[0],why:"Les comptes de secours protègent contre le verrouillage total du tenant, et le mode rapport seul permet de mesurer l'impact avant l'application.",
 ko:{1:"Exclure durablement les administrateurs revient à laisser les comptes les plus sensibles sans MFA.",2:"Les paramètres de sécurité par défaut sont incompatibles avec l'accès conditionnel.",3:"Cela ne répond pas au besoin exprimé."}},
{id:"q022",o:"2.2.8",t:"single",q:"Un compte est désactivé pendant qu'une session Exchange Online est active. Vous voulez que l'accès cesse en quelques minutes sans attendre l'expiration du jeton. Quelle fonctionnalité ?",
 opts:["Évaluation continue de l'accès (CAE)","Durée de vie de session configurable","Fréquence de connexion à 1 heure","Restrictions imposées par l'application"],
 a:[0],why:"CAE permet au fournisseur de ressource de réagir quasiment en temps réel à des événements critiques comme la désactivation du compte ou la révocation des sessions.",
 ko:{1:"Elle ne réagit pas à un événement, elle borne seulement la durée.",2:"Une heure reste une fenêtre d'exposition et impacte tous les utilisateurs.",3:"Elles limitent les fonctions dans l'application, sans révoquer la session."}},
{id:"q023",o:"2.2.9",t:"single",q:"Un site SharePoint contient des données très sensibles. Vous voulez exiger une authentification renforcée pour ce seul site, sans durcir tout SharePoint. Que mettez-vous en place ?",
 opts:["Un contexte d'authentification référencé par une étiquette de confidentialité et une stratégie d'accès conditionnel dédiée","Une stratégie d'accès conditionnel sur l'application SharePoint Online","Une stratégie de session avec fréquence de connexion réduite","Un package d'accès pour le site"],
 a:[0],why:"Le contexte d'authentification permet de cibler une ressource précise à l'intérieur d'une application et d'y attacher des exigences renforcées.",
 ko:{1:"Cela s'appliquerait à l'ensemble de SharePoint Online.",2:"Une session plus courte ne renforce pas le niveau d'authentification exigé pour une ressource donnée.",3:"Un package d'accès gouverne l'attribution, pas l'exigence à la connexion."}},
{id:"q024",o:"2.2.10",t:"single",q:"Vous souhaitez qu'un administrateur ne puisse pas supprimer une stratégie d'accès conditionnel sans réauthentification forte, même s'il détient le rôle nécessaire. Quelle fonctionnalité ?",
 opts:["Les actions protégées associées à un contexte d'authentification","PIM avec approbation","Une unité administrative à gestion restreinte","Une stratégie de risque utilisateur"],
 a:[0],why:"Les actions protégées associent des exigences d'accès conditionnel à des opérations d'administration précises, en plus des permissions du rôle.",
 ko:{1:"PIM contrôle l'obtention du rôle, pas chaque opération une fois le rôle actif.",2:"Elle restreint le périmètre d'objets utilisateurs, pas les opérations de configuration.",3:"Elle réagit à un signal de compromission, pas à une action sensible."}},
{id:"q025",o:"2.3.1",t:"single",q:"Vous voulez forcer un changement de mot de passe sécurisé pour les comptes dont le risque utilisateur est élevé. Quelle est la configuration attendue ?",
 opts:["Une stratégie d'accès conditionnel ciblant le risque utilisateur élevé avec l'exigence de changement de mot de passe, MFA au préalable","Une stratégie de risque de connexion en mode blocage","Une campagne d'inscription MFA","Une revue d'accès sur les utilisateurs à risque"],
 a:[0],why:"Le risque utilisateur qualifie le compte, et la remédiation attendue est le changement de mot de passe sécurisé, précédé d'un MFA. Microsoft recommande désormais de porter ces stratégies dans l'accès conditionnel.",
 ko:{1:"Le risque de connexion qualifie la session en cours, pas la compromission du compte.",2:"Une campagne inscrit les utilisateurs à une méthode, elle ne remédie pas un compte compromis.",3:"La revue d'accès traite les droits, pas la compromission."}},
{id:"q026",o:"2.3.4",t:"single",q:"Un utilisateur signalé à risque a prouvé qu'il s'agissait d'un déplacement légitime. Quelle action mène à l'apprentissage correct du système ?",
 opts:["Rejeter le risque de l'utilisateur (dismiss) depuis ID Protection","Supprimer l'utilisateur des journaux","Réinitialiser le mot de passe","Exclure l'utilisateur des stratégies de risque"],
 a:[0],why:"Le rejet du risque remet le compte à un niveau de risque nul et alimente le modèle, contrairement à une exclusion qui laisse le compte non protégé.",
 ko:{1:"Les journaux ne sont pas modifiables.",2:"Cela remédierait un risque réel, mais ce n'est pas la bonne réponse pour un faux positif.",3:"L'exclusion crée une faille durable."}},
{id:"q027",o:"2.1.7",t:"single",q:"Les utilisateurs synchronisés doivent pouvoir réinitialiser leur mot de passe eux-mêmes, avec prise en compte immédiate sur les serveurs de fichiers du domaine. Que faut-il ?",
 opts:["SSPR avec écriture différée des mots de passe, configurée dans Entra Connect","SSPR seul, licence Free","Protection de mot de passe Entra sur les contrôleurs de domaine","Authentification directe"],
 a:[0],why:"Sans écriture différée, le nouveau mot de passe n'existe que dans le cloud ; les ressources du domaine continueraient d'attendre l'ancien.",
 ko:{1:"Le SSPR pour les comptes cloud requiert P1 et ne gère pas le retour vers AD.",2:"Elle empêche les mots de passe faibles, sans rapport avec la réinitialisation.",3:"Elle valide les mots de passe, elle ne les réécrit pas."}},
{id:"q028",o:"2.1.10",t:"multi",q:"Vous déployez la protection de mot de passe Entra sur Active Directory. Quels éléments sont nécessaires ? (deux réponses)",
 opts:["Un service proxy de protection de mot de passe","Un agent installé sur les contrôleurs de domaine","AD FS","L'authentification directe"],
 a:[0,1],why:"Le déploiement sur site combine un ou plusieurs proxys, qui joignent le cloud, et l'agent DC installé sur chaque contrôleur de domaine à protéger.",
 ko:{2:"AD FS n'intervient pas dans ce mécanisme.",3:"L'authentification directe est indépendante de la protection de mot de passe."}},
{id:"q029",o:"2.1.5",t:"single",q:"Le RSSI exige des méthodes résistantes au hameçonnage pour les administrateurs. Quelle combinaison retenez-vous ?",
 opts:["Passkeys FIDO2, Windows Hello Entreprise ou authentification par certificat","Authenticator avec correspondance de numéro et SMS de secours","Jetons OATH matériels et appels vocaux","Mot de passe long et questions de sécurité"],
 a:[0],why:"Seules ces trois familles sont classées comme résistantes au hameçonnage, car le secret ne peut pas être rejoué sur un site frauduleux.",
 ko:{1:"La correspondance de numéro est robuste mais reste un facteur pouvant être détourné, et le SMS est faible.",2:"Ni les jetons OATH ni les appels ne sont résistants au hameçonnage.",3:"Ce n'est pas du multifacteur."}},
{id:"q030",o:"2.1.6",t:"single",q:"Le tenant utilise encore les paramètres de sécurité par défaut. Vous devez déployer des stratégies d'accès conditionnel granulaires. Quelle est la première action ?",
 opts:["Désactiver les paramètres de sécurité par défaut","Activer le MFA par utilisateur (legacy) en parallèle","Passer les stratégies d'accès conditionnel en mode rapport seul","Activer PIM"],
 a:[0],why:"Les paramètres de sécurité par défaut et l'accès conditionnel s'excluent mutuellement : il faut désactiver les premiers, après avoir préparé les stratégies de remplacement.",
 ko:{1:"Le MFA par utilisateur est l'ancien mécanisme, source de conflits.",2:"Le mode rapport seul est utile, mais les stratégies restent inertes tant que les paramètres par défaut sont actifs.",3:"PIM ne joue aucun rôle ici."}},
{id:"q031",o:"2.2.3",t:"single",q:"Vous voulez bloquer l'accès depuis tous les pays sauf la France et la Belgique. Quelle démarche est correcte ?",
 opts:["Créer un emplacement nommé contenant la France et la Belgique, puis une stratégie de blocage ciblant tous les emplacements en excluant cet emplacement","Créer une stratégie de blocage ciblant tous les pays sauf ceux autorisés, listés un à un","Utiliser un filtre sur les appareils","Utiliser une stratégie de risque de connexion"],
 a:[0],why:"L'approche standard est la liste blanche par exclusion : cibler « Tout emplacement » et exclure l'emplacement nommé autorisé, ce qui reste juste quand la liste des pays évolue.",
 ko:{1:"Ingérable et sujet à erreurs à chaque évolution géographique.",2:"Le filtre sur appareils cible des propriétés d'appareil, pas la géographie.",3:"Le risque de connexion ne code pas une politique géographique."}},
{id:"q032",o:"2.2.6",t:"single",q:"Sur les appareils non gérés, les utilisateurs doivent pouvoir consulter les documents dans le navigateur mais pas les télécharger. Que configurez-vous ?",
 opts:["Une stratégie d'accès conditionnel avec restrictions imposées par l'application, et la restriction correspondante dans SharePoint Online","Une stratégie de session avec fréquence de connexion","Le blocage complet des appareils non conformes","Une stratégie de risque utilisateur"],
 a:[0],why:"Les restrictions imposées par l'application transmettent le signal « appareil non géré » à SharePoint et Exchange, qui appliquent alors l'expérience limitée.",
 ko:{1:"Cela ne change pas les capacités de téléchargement.",2:"Le besoin est un accès dégradé, pas un blocage.",3:"Sans rapport avec la gestion des appareils."}},
{id:"q033",o:"2.4.2",t:"single",q:"Les prestataires doivent atteindre un serveur interne en RDP sans VPN, avec accès conditionnel appliqué. Quelle solution ?",
 opts:["Microsoft Entra Private Access avec le client Global Secure Access","Application Proxy","Entra Domain Services","Un package d'accès"],
 a:[0],why:"Private Access prend en charge les protocoles arbitraires, dont RDP, avec un client installé et l'accès conditionnel appliqué par application ou segment.",
 ko:{1:"Application Proxy ne publie que des applications web.",2:"Il fournit un domaine managé, pas un accès distant.",3:"Il gouverne l'attribution de droits, pas la connectivité réseau."}},
{id:"q034",o:"2.3.3",t:"single",q:"60 % des utilisateurs ne sont inscrits qu'au SMS. Vous voulez les faire migrer vers Microsoft Authenticator sans les bloquer. Quelle fonctionnalité ?",
 opts:["Une campagne d'inscription qui invite l'utilisateur à ajouter Authenticator lors de la connexion","La stratégie d'inscription combinée obligatoire immédiate","Une stratégie d'accès conditionnel bloquant le SMS","Un Temporary Access Pass pour chacun"],
 a:[0],why:"La campagne d'inscription pousse l'utilisateur vers une méthode plus forte au moment de la connexion, avec la possibilité de reporter, ce qui évite le blocage.",
 ko:{1:"Trop brutal pour une population de cette taille.",2:"Cela bloquerait effectivement les utilisateurs, contrairement à l'objectif.",3:"Le TAP est un outil d'amorçage individuel, pas de migration de masse."}},
{id:"q035",o:"2.2.2",t:"order",q:"Remettez dans l'ordre le cycle de déploiement recommandé d'une nouvelle stratégie d'accès conditionnel.",
 items:["Définir le besoin et identifier les populations et applications concernées","Créer la stratégie en mode rapport seul","Analyser l'impact dans les journaux de connexion et l'onglet d'insights","Ajouter les exclusions nécessaires, dont les comptes de secours","Activer la stratégie sur un groupe pilote","Étendre à l'ensemble de la population et surveiller"],
 why:"Le mode rapport seul et l'analyse d'impact précèdent toujours l'activation, et le déploiement se fait par vagues avec un pilote."},
{id:"q036",o:"2.1.9",t:"single",q:"Un salarié part immédiatement. Vous devez couper l'accès aux sessions déjà ouvertes. Quelle action est la plus directe ?",
 opts:["Révoquer les sessions de l'utilisateur, ce qui invalide les jetons d'actualisation","Réinitialiser son mot de passe","Supprimer ses licences","Le retirer de tous les groupes"],
 a:[0],why:"La révocation invalide les jetons d'actualisation ; combinée à CAE, l'effet sur les sessions actives est quasi immédiat.",
 ko:{1:"Utile, mais les jetons d'accès déjà émis peuvent rester valides.",2:"Le retrait de licence n'expulse pas des sessions.",3:"Cela retire des droits futurs, pas les sessions en cours."}},
{id:"q037",o:"2.1.2",t:"single",q:"L'organisation veut authentifier avec des cartes à puce existantes, directement contre Entra ID, en supprimant AD FS. Quelle méthode ?",
 opts:["Authentification par certificat Entra, avec chargement des autorités de certification et règles de liaison","Fédération avec AD FS conservée","Jetons OATH","Authentification directe"],
 a:[0],why:"La CBA Entra permet de valider un certificat X.509 nativement, ce qui est justement le chemin de sortie d'AD FS pour les cartes à puce.",
 ko:{1:"L'objectif est de supprimer AD FS.",2:"Un jeton OATH ne remplace pas un certificat de carte à puce.",3:"Elle valide un mot de passe, pas un certificat."}},
{id:"q038",o:"2.3.5",t:"single",q:"Un principal de service se connecte depuis une adresse IP anonyme inhabituelle. Vous voulez traiter ce type de risque. Quel prérequis ?",
 opts:["Des licences Workload Identities Premium, qui ouvrent les stratégies de risque et l'accès conditionnel pour les identités de charge de travail","Entra ID P1","Une licence Defender for Cloud Apps","Une licence ID Governance"],
 a:[0],why:"Les identités de charge de travail à risque et l'accès conditionnel appliqué aux principaux de service relèvent de la licence Workload ID.",
 ko:{1:"P1 couvre l'accès conditionnel pour les utilisateurs, pas pour les identités applicatives.",2:"MDCA traite les applications cloud, pas ce cas.",3:"La gouvernance couvre les revues et les packages d'accès."}},
{id:"q039",o:"2.2.11",t:"single",q:"Vous voulez démarrer rapidement avec un socle de stratégies éprouvées, sans les écrire de zéro. Quel est le comportement des modèles d'accès conditionnel ?",
 opts:["Ils créent une stratégie préconfigurée, par défaut en mode rapport seul, que vous ajustez avant activation","Ils activent immédiatement la stratégie pour tous","Ils remplacent les stratégies existantes","Ils sont réservés aux tenants sans stratégie"],
 a:[0],why:"Les modèles produisent une stratégie prête à l'emploi mais inactive, ce qui laisse le temps de définir les exclusions.",
 ko:{1:"Ce serait un risque de verrouillage inacceptable.",2:"Ils s'ajoutent aux stratégies existantes.",3:"Aucune restriction de ce type."}},

/* ---------------- D3 · identités de charge de travail ---------------- */
{id:"q040",o:"3.1.1",t:"single",q:"Une fonction Azure doit lire des secrets dans Key Vault sans stocker d'identifiants. Quelle identité ?",
 opts:["Une identité managée affectée par le système, avec une attribution de rôle sur le coffre","Une inscription d'application avec un secret client","Un compte utilisateur de service","Une clé d'accès partagée"],
 a:[0],why:"L'identité managée supprime tout secret à gérer et sa rotation est prise en charge par la plateforme.",
 ko:{1:"Un secret client doit être stocké et renouvelé, ce que le scénario exclut.",2:"Un compte utilisateur ne peut pas porter de MFA et brouille la traçabilité.",3:"Ce n'est pas une identité Entra."}},
{id:"q041",o:"3.1.2",t:"single",q:"Cinq machines virtuelles d'un même service doivent partager les mêmes autorisations sur un compte de stockage, et l'identité doit survivre à la suppression d'une machine. Quel choix ?",
 opts:["Une identité managée affectée par l'utilisateur, associée aux cinq machines","Cinq identités managées affectées par le système","Un principal de service avec certificat","Un groupe de sécurité contenant les machines"],
 a:[0],why:"L'identité affectée par l'utilisateur est un objet indépendant, réutilisable par plusieurs ressources et non détruit avec l'une d'elles.",
 ko:{1:"Cela multiplie les attributions de rôles à maintenir.",2:"Un certificat introduit un secret à gérer alors qu'Azure peut s'en passer.",3:"Un groupe d'appareils ne porte pas d'autorisations Azure RBAC de cette façon."}},
{id:"q042",o:"3.3.4",t:"single",q:"Une application démon doit lire tous les calendriers du tenant sans utilisateur connecté. Quelle configuration ?",
 opts:["Une permission applicative Calendars.Read, avec consentement administrateur","Une permission déléguée Calendars.Read","Une permission déléguée Calendars.ReadWrite avec consentement utilisateur","Un rôle Entra Exchange Administrator attribué à l'application"],
 a:[0],why:"Sans utilisateur, seule une permission applicative fonctionne, et elle exige obligatoirement un consentement administrateur.",
 ko:{1:"Une permission déléguée suppose un utilisateur connecté et se limite à ses propres données.",2:"Même problème, plus un consentement inadapté.",3:"Les rôles Entra ne remplacent pas les permissions Graph pour un démon."}},
{id:"q043",o:"3.2.6",t:"single",q:"Vous voulez interdire aux utilisateurs de consentir aux applications tierces tout en évitant de multiplier les tickets. Quelle configuration ?",
 opts:["Désactiver le consentement utilisateur et activer le workflow de demande de consentement administrateur","Désactiver le consentement utilisateur seul","Autoriser le consentement pour les éditeurs vérifiés uniquement, sans workflow","Bloquer l'inscription d'applications"],
 a:[0],why:"Le workflow de demande permet aux utilisateurs de solliciter une approbation, ce qui conserve la maîtrise sans créer de blocage silencieux.",
 ko:{1:"Les utilisateurs se retrouveraient bloqués sans chemin de recours.",2:"C'est une option intermédiaire valable, mais elle ne répond pas à l'exigence d'interdire le consentement utilisateur.",3:"Cela concerne la création d'applications, pas le consentement."}},
{id:"q044",o:"3.2.4",t:"single",q:"Vous intégrez une application SaaS avec SSO SAML. L'application doit aussi créer et désactiver automatiquement les comptes. Que configurez-vous en plus ?",
 opts:["Le provisioning automatique via SCIM sur l'application d'entreprise","Un package d'accès","La synchronisation entre locataires","Entra Connect Sync"],
 a:[0],why:"Le SSO gère l'authentification, le provisioning gère le cycle de vie des comptes dans l'application cible ; ce sont deux configurations distinctes.",
 ko:{1:"Il gouverne l'attribution des accès, pas la création de comptes dans l'application.",2:"Elle relie deux tenants Entra.",3:"Il synchronise depuis Active Directory sur site."}},
{id:"q045",o:"3.2.3",t:"single",q:"Une application web interne doit être accessible depuis Internet, sans VPN et sans ouverture de port entrant. Quelle solution ?",
 opts:["Application Proxy avec un connecteur installé sur le réseau interne","Une passerelle VPN Azure","Entra Domain Services","Une règle NAT sur le pare-feu"],
 a:[0],why:"Le connecteur établit une connexion sortante vers le service, ce qui évite toute ouverture entrante, et la publication passe par une application d'entreprise soumise à l'accès conditionnel.",
 ko:{1:"Cela suppose un client VPN, contrairement à l'énoncé.",2:"Sans rapport avec la publication d'applications.",3:"C'est exactement l'exposition entrante à éviter."}},
{id:"q046",o:"3.2.5",t:"single",q:"Une application d'entreprise a l'option « Affectation requise » activée. Quelle conséquence ?",
 opts:["Seuls les utilisateurs et groupes explicitement affectés peuvent s'authentifier auprès de l'application","Tous les utilisateurs du tenant peuvent se connecter, mais l'application apparaît uniquement pour les affectés","L'accès conditionnel est ignoré","Le provisioning devient obligatoire"],
 a:[0],why:"Sans affectation, la tentative d'authentification est refusée : c'est le contrôle d'accès le plus simple au niveau de l'application.",
 ko:{1:"Cela décrit la visibilité dans le portail My Apps, pas l'exigence d'affectation.",2:"L'accès conditionnel continue de s'appliquer.",3:"Les deux fonctions sont indépendantes."}},
{id:"q047",o:"3.3.3",t:"single",q:"Un développeur signale que l'authentification échoue après la mise en production, avec une erreur de correspondance d'URI. Quelle vérification ?",
 opts:["L'URI de redirection déclaré dans l'inscription d'application doit correspondre exactement à celui envoyé, y compris le protocole et la casse du chemin","Le secret client a expiré","Les permissions API n'ont pas reçu le consentement","Le compte n'est pas affecté à l'application"],
 a:[0],why:"L'erreur de correspondance d'URI est spécifique : Entra compare l'URI de redirection reçu à la liste enregistrée, sans tolérance.",
 ko:{1:"Un secret expiré produit une erreur d'identifiant invalide, différente.",2:"Un défaut de consentement produit une erreur de consentement.",3:"Une affectation manquante renvoie une erreur d'accès refusé, pas d'URI."}},
{id:"q048",o:"3.3.5",t:"single",q:"Une application métier doit distinguer les rôles Lecteur et Approbateur, et l'attribution doit se faire dans Entra plutôt que dans l'application. Que créez-vous ?",
 opts:["Des rôles d'application dans le manifeste de l'inscription, affectés ensuite à des groupes","Des rôles Entra personnalisés","Des unités administratives","Des attributs de sécurité personnalisés"],
 a:[0],why:"Les rôles d'application sont émis dans le jeton, ce qui permet à l'application de décider en fonction du rôle affecté dans Entra.",
 ko:{1:"Les rôles Entra régissent l'administration du tenant, pas la logique métier d'une application.",2:"Elles délimitent une administration.",3:"Ils classifient des objets, sans effet sur les jetons applicatifs."}},
{id:"q049",o:"3.4.4",t:"single",q:"Vous voulez empêcher le téléchargement de fichiers depuis une application SaaS tierce sur les appareils non gérés, avec contrôle en temps réel dans la session.",
 opts:["Conditional Access App Control avec une stratégie de session dans Defender for Cloud Apps","Les restrictions imposées par l'application","Une stratégie d'accès conditionnel de blocage","Le cloud discovery"],
 a:[0],why:"Le contrôle d'application par accès conditionnel place la session derrière un proxy inverse, ce qui autorise l'inspection et le blocage d'actions en temps réel, y compris pour les applications tierces.",
 ko:{1:"Elles ne fonctionnent qu'avec les services Microsoft qui savent les interpréter.",2:"Le besoin est un accès partiel, pas un blocage.",3:"La découverte identifie l'usage, elle ne contrôle rien."}},
{id:"q050",o:"3.4.6",t:"single",q:"Vous voulez détecter et révoquer automatiquement les applications OAuth qui obtiennent des permissions à haut privilège sur les boîtes aux lettres. Quelle capacité ?",
 opts:["Les stratégies d'application OAuth dans Defender for Cloud Apps","Les stratégies d'accès conditionnel","Le journal de provisioning","Les rôles d'application"],
 a:[0],why:"MDCA inventorie les applications OAuth consenties, évalue leur niveau de privilège et permet de révoquer le consentement, manuellement ou par stratégie.",
 ko:{1:"L'accès conditionnel s'applique aux connexions, pas au consentement déjà accordé.",2:"Il trace le provisioning de comptes.",3:"Ils définissent des rôles métier."}},
{id:"q051",o:"3.4.1",t:"single",q:"La direction veut connaître les applications cloud utilisées sans validation. Quelle est la première étape dans Defender for Cloud Apps ?",
 opts:["Configurer le cloud discovery en envoyant les journaux de pare-feu ou de proxy, ou via l'intégration Defender for Endpoint","Connecter chaque application par connecteur API","Créer des stratégies de session","Activer les restrictions imposées par l'application"],
 a:[0],why:"La découverte s'appuie sur les journaux de trafic ou sur les appareils intégrés à Defender for Endpoint pour révéler l'informatique fantôme.",
 ko:{1:"Un connecteur suppose que l'on connaît déjà l'application et que l'on en est administrateur.",2:"Les stratégies viennent après la découverte.",3:"Sans lien avec l'inventaire d'usage."}},
{id:"q052",o:"3.2.2",t:"single",q:"Un opérateur doit gérer toutes les applications d'entreprise, y compris le consentement admin, mais ne doit pas pouvoir créer d'inscriptions. Quel rôle privilégier ?",
 opts:["Administrateur d'applications cloud","Administrateur d'applications","Administrateur général","Développeur d'applications"],
 a:[0],why:"Administrateur d'applications cloud correspond à Administrateur d'applications sans la capacité de gérer le proxy d'application, et reste le choix de moindre privilège dans ce type d'énoncé.",
 ko:{1:"Il ajoute la gestion du proxy d'application, au-delà du besoin.",2:"Excessif.",3:"Ce rôle permet précisément de créer des inscriptions, ce que l'on veut éviter."}},
{id:"q053",o:"3.1.4",t:"yesno",q:"À propos des identités managées, chaque affirmation est-elle vraie ?",
 subs:[
  {s:"Une identité managée affectée par le système est supprimée avec la ressource","a":true,why:"Son cycle de vie est lié à celui de la ressource."},
  {s:"Une identité managée peut recevoir des permissions Microsoft Graph applicatives","a":true,why:"On attribue des rôles d'application Graph au principal de service de l'identité managée."},
  {s:"Une identité managée dispose d'un secret client à renouveler tous les deux ans","a":false,why:"Aucun secret n'est exposé, la plateforme gère les informations d'identification."},
  {s:"Une identité managée peut être utilisée depuis un serveur hébergé hors d'Azure","a":false,why:"Elle suppose une ressource Azure ; hors Azure, il faut un principal de service ou une fédération d'identité de charge de travail."}
 ]},
{id:"q054",o:"3.2.7",t:"single",q:"Les utilisateurs se plaignent de ne pas retrouver leurs applications métiers dans le portail Mes applications. Quelle fonctionnalité améliore l'organisation ?",
 opts:["Les collections d'applications, affectées à des groupes","Les rôles d'application","Les packages d'accès","Les unités administratives"],
 a:[0],why:"Les collections regroupent les applications par thème ou par métier et se ciblent sur des groupes d'utilisateurs.",
 ko:{1:"Ils portent l'autorisation dans l'application.",2:"Ils gèrent la demande d'accès, pas la présentation.",3:"Elles concernent l'administration déléguée."}},

/* ---------------- D4 · gouvernance ---------------- */
{id:"q055",o:"4.3.1",t:"single",q:"Les administrateurs généraux doivent activer leur rôle pour huit heures maximum, avec justification et approbation. Quelle configuration ?",
 opts:["Des affectations éligibles dans PIM, avec paramètres de rôle imposant la durée, la justification et l'approbation","Des affectations actives permanentes et une revue d'accès mensuelle","Une stratégie d'accès conditionnel avec fréquence de connexion","Une unité administrative à gestion restreinte"],
 a:[0],why:"PIM sépare l'éligibilité de l'activation : les paramètres du rôle définissent durée maximale, MFA, justification et approbation.",
 ko:{1:"Le privilège resterait permanent entre deux revues.",2:"Cela n'a aucun effet sur la détention du rôle.",3:"Elle protège des objets, pas l'attribution de rôles."}},
{id:"q056",o:"4.3.6",t:"multi",q:"Quelles pratiques s'appliquent aux comptes de secours (break-glass) ? (deux réponses)",
 opts:["Les exclure des stratégies d'accès conditionnel qui pourraient les verrouiller","Créer au moins deux comptes cloud uniquement, sans dépendance à la synchronisation","Les synchroniser depuis Active Directory pour cohérence","Les utiliser quotidiennement pour l'administration"],
 a:[0,1],why:"Ces comptes doivent survivre à une panne de fédération, à une erreur de stratégie et à un incident sur site ; ils sont surveillés par alerte à chaque usage.",
 ko:{2:"Une dépendance à la synchronisation ruine leur raison d'être.",3:"Leur usage doit être exceptionnel et déclencher une alerte."}},
{id:"q057",o:"4.1.3",t:"single",q:"Un prestataire externe doit obtenir, sur demande, l'accès à un site SharePoint, deux groupes et une application, pour six mois, avec approbation du responsable de projet. Quelle solution ?",
 opts:["Un package d'accès dans un catalogue, avec stratégie d'approbation et expiration","Une revue d'accès trimestrielle","Une attribution directe par le support","Un rôle personnalisé"],
 a:[0],why:"Le package d'accès regroupe plusieurs ressources, encadre la demande, l'approbation et l'expiration, y compris pour des utilisateurs externes.",
 ko:{1:"Elle contrôle a posteriori des accès déjà accordés.",2:"Ni traçable ni expirant automatiquement.",3:"Il concerne l'administration du tenant."}},
{id:"q058",o:"4.1.7",t:"single",q:"Vous voulez qu'un partenaire puisse demander lui-même des packages d'accès, sans invitation préalable de chacun de ses collaborateurs. Que configurez-vous ?",
 opts:["Une organisation connectée pour le domaine du partenaire, avec une stratégie autorisant les utilisateurs non présents dans l'annuaire","Une fédération directe","Une synchronisation entre locataires","Une invitation en masse par CSV"],
 a:[0],why:"L'organisation connectée définit les tenants ou domaines partenaires dont les utilisateurs peuvent demander un package ; l'objet invité est créé lors de l'approbation.",
 ko:{1:"Elle traite l'authentification des domaines non Entra, pas la demande de packages.",2:"Elle provisionne massivement, sans logique de demande.",3:"Cela suppose de connaître à l'avance chaque collaborateur."}},
{id:"q059",o:"4.2.2",t:"single",q:"Une revue d'accès sur un groupe est configurée avec « Si les réviseurs ne répondent pas : Supprimer l'accès ». Un réviseur ne répond pas. Que se passe-t-il ?",
 opts:["L'accès des utilisateurs non revus est retiré à la fin de la revue","L'accès est conservé et un rappel est envoyé","La revue est prolongée automatiquement","Les utilisateurs sont désactivés"],
 a:[0],why:"L'option définit précisément le sort des décisions manquantes ; les autres valeurs possibles sont conserver l'accès, ou appliquer les recommandations.",
 ko:{1:"C'est le comportement de l'option « Aucune modification ».",2:"Aucune prolongation automatique.",3:"Une revue retire un accès, elle ne désactive pas le compte."}},
{id:"q060",o:"4.2.1",t:"single",q:"Vous voulez recertifier chaque trimestre les invités présents dans les groupes Microsoft 365, en laissant les invités s'auto-attester si le propriétaire ne répond pas. Quel type de réviseur ?",
 opts:["Propriétaires de groupe, avec une seconde étape confiée aux utilisateurs eux-mêmes","Administrateur général uniquement","Les managers des invités","Un groupe d'auditeurs externes"],
 a:[0],why:"Les revues acceptent plusieurs types de réviseurs et prennent en charge les revues à plusieurs étapes ; l'auto-attestation est prévue pour les invités.",
 ko:{1:"Non tenable à l'échelle et contraire au moindre privilège.",2:"Les invités n'ont généralement pas de manager renseigné dans le tenant.",3:"Ils manquent du contexte métier."}},
{id:"q061",o:"4.1.5",t:"single",q:"Les prestataires doivent accepter une charte avant d'accéder aux applications, et la réaccepter chaque année. Quelle mise en œuvre ?",
 opts:["Des conditions d'utilisation avec réacceptation périodique, imposées par une stratégie d'accès conditionnel","Une bannière de connexion personnalisée","Un contrôle d'octroi « Nécessiter une application cliente approuvée »","Une revue d'accès annuelle"],
 a:[0],why:"Les conditions d'utilisation sont un contrôle d'octroi de l'accès conditionnel, avec fréquence de réacceptation et traçabilité des consentements.",
 ko:{1:"L'identité visuelle n'apporte aucune preuve d'acceptation.",2:"Sans rapport avec l'acceptation d'un document.",3:"Elle ne recueille pas de consentement."}},
{id:"q062",o:"4.4.3",t:"single",q:"Vous devez conserver les journaux de connexion deux ans et exécuter des requêtes KQL dessus. Quelle configuration ?",
 opts:["Un paramètre de diagnostic Entra qui envoie SigninLogs vers un espace de travail Log Analytics, avec la rétention adaptée","Augmenter la rétention dans le portail Entra","Exporter manuellement en CSV chaque mois","Activer Identity Secure Score"],
 a:[0],why:"La rétention native est limitée ; l'envoi vers Log Analytics permet à la fois la conservation longue et l'analyse en KQL.",
 ko:{1:"La rétention native n'est pas configurable au-delà des limites de l'édition.",2:"Ni interrogeable en KQL, ni fiable.",3:"C'est un indicateur de posture."}},
{id:"q063",o:"4.4.1",t:"single",q:"Vous cherchez qui a ajouté un compte au rôle Administrateur général la semaine dernière. Où regardez-vous ?",
 opts:["Le journal d'audit","Le journal de connexion","Le journal de provisioning","Les détections de risque"],
 a:[0],why:"Le journal d'audit trace les modifications d'objets et d'attributions de rôles, avec l'acteur, la cible et l'horodatage.",
 ko:{1:"Il trace les authentifications.",2:"Il trace les opérations de provisioning applicatif.",3:"Elles décrivent des signaux de compromission."}},
{id:"q064",o:"4.3.3",t:"single",q:"Un groupe donne accès à une application financière très sensible. Vous voulez que l'appartenance à ce groupe soit temporaire et approuvée. Quelle fonctionnalité ?",
 opts:["PIM for Groups, avec appartenance éligible et approbation","Une revue d'accès mensuelle","Un groupe dynamique","Un package d'accès sans approbation"],
 a:[0],why:"PIM for Groups étend l'activation juste-à-temps à l'appartenance et à la propriété de groupes, y compris pour des groupes qui donnent accès à des applications.",
 ko:{1:"Elle ne rend pas l'appartenance temporaire au quotidien.",2:"Une règle d'attribut ne relève pas d'une demande approuvée.",3:"Sans approbation, l'exigence n'est pas satisfaite."}},
{id:"q065",o:"4.3.5",t:"single",q:"Un auditeur demande la liste des activations de rôle privilégié des 90 derniers jours, avec les justifications. Où la trouvez-vous ?",
 opts:["L'historique d'audit de PIM","Le journal de connexion","Identity Secure Score","Le rapport d'inscription aux méthodes"],
 a:[0],why:"PIM conserve un historique dédié des demandes, approbations et activations, avec les justifications saisies.",
 ko:{1:"Il ne contient pas les justifications d'activation.",2:"Indicateur de posture, sans historique nominatif.",3:"Il concerne l'inscription MFA."}},
{id:"q066",o:"4.4.5",t:"single",q:"La direction demande un indicateur simple pour suivre l'amélioration de la posture d'identité dans le temps. Que proposez-vous ?",
 opts:["Identity Secure Score, avec le suivi des actions recommandées et la comparaison sectorielle","Le nombre de connexions réussies","Le taux d'utilisation des licences","Le nombre de stratégies d'accès conditionnel"],
 a:[0],why:"Identity Secure Score agrège les bonnes pratiques identité en un score suivi dans le temps, avec des actions concrètes.",
 ko:{1:"Aucune valeur de sécurité.",2:"Indicateur financier.",3:"Le nombre ne dit rien de l'efficacité."}},
{id:"q067",o:"4.1.4",t:"single",q:"Une demande de package d'accès reste bloquée. Le demandeur affirme avoir été approuvé. Quelle piste vérifier en priorité ?",
 opts:["La stratégie du package : approbation en plusieurs étapes, approbateur de secours et délai d'expiration de la demande","Le journal de connexion du demandeur","La licence du demandeur","Le rôle Entra de l'approbateur"],
 a:[0],why:"Les stratégies de package peuvent exiger plusieurs étapes ; une étape suivante non traitée laisse la demande en attente jusqu'à expiration.",
 ko:{1:"Sans lien avec le circuit d'approbation.",2:"Les packages ne dépendent pas de la licence du demandeur.",3:"Un approbateur n'a pas besoin d'un rôle Entra."}},
{id:"q068",o:"4.2.4",t:"single",q:"Une revue d'accès est terminée mais les accès refusés restent en place. Quelle explication est la plus probable ?",
 opts:["L'application automatique des résultats n'était pas activée : il faut appliquer les décisions manuellement","La revue n'a pas expiré","Les réviseurs n'ont pas assez de droits","Une stratégie d'accès conditionnel bloque le retrait"],
 a:[0],why:"Sans application automatique, les décisions sont enregistrées mais ne modifient rien tant qu'un administrateur ne les applique pas.",
 ko:{1:"Une revue terminée est bien close.",2:"Les réviseurs décident, ils n'appliquent pas.",3:"L'accès conditionnel ne bloque pas les modifications d'appartenance."}},
{id:"q069",o:"4.1.2",t:"order",q:"Remettez dans l'ordre la mise en place d'une gestion des droits pour un projet inter-entreprises.",
 items:["Créer un catalogue et y ajouter les ressources : groupes, applications, sites","Déclarer les organisations connectées des partenaires","Créer un package d'accès regroupant les ressources du projet","Définir la stratégie : qui peut demander, qui approuve, durée et expiration","Publier le package et communiquer le portail Mon accès","Suivre les demandes et déclencher une revue d'accès périodique"],
 why:"On construit toujours le contenant (catalogue) avant le contenu (package), et la stratégie avant la publication."},
{id:"q070",o:"4.4.2",t:"hot",q:"Pour chaque besoin, sélectionnez la destination de diagnostic appropriée.",
 rows:[
  {s:"Requêtes analytiques et corrélation avec d'autres sources",options:["Espace de travail Log Analytics","Compte de stockage","Azure Event Hubs"],a:0,why:"Log Analytics est la destination interrogeable en KQL."},
  {s:"Archivage économique à long terme",options:["Espace de travail Log Analytics","Compte de stockage","Azure Event Hubs"],a:1,why:"Le compte de stockage est la destination d'archivage à moindre coût."},
  {s:"Transmission en flux vers un SIEM tiers",options:["Espace de travail Log Analytics","Compte de stockage","Azure Event Hubs"],a:2,why:"Event Hubs sert de point de diffusion vers des systèmes externes."}
 ]},
{id:"q071",o:"4.3.2",t:"single",q:"Un ingénieur doit détenir le rôle Contributeur sur un groupe de ressources Azure uniquement pendant les fenêtres de maintenance. Quelle solution ?",
 opts:["Une affectation éligible dans PIM pour les ressources Azure, au périmètre du groupe de ressources","Une affectation permanente et une revue d'accès","Un rôle Entra personnalisé","Une unité administrative"],
 a:[0],why:"PIM couvre aussi les rôles Azure RBAC : l'éligibilité s'attribue au périmètre choisi, abonnement, groupe de ressources ou ressource.",
 ko:{1:"Le privilège reste permanent.",2:"Les rôles Entra ne s'appliquent pas aux ressources Azure.",3:"Elle délimite des objets d'annuaire."}},
{id:"q072",o:"4.1.6",t:"single",q:"Vous voulez que les invités inactifs depuis 90 jours soient automatiquement bloqués puis supprimés. Quelle capacité ?",

EN.cards={
 0:["When should you recommend an administrative unit?","When an administrator should only act on a subset of objects: a branch, a region, a sensitive population. It restricts the scope, not the actions."],
 1:["Entra role versus Azure RBAC role","Entra roles administer the directory and Microsoft 365. Azure RBAC administers Azure resources. The User Access Administrator role plus elevate access bridges the two."],
 2:["What is special about role-assignable groups?","The property is set at creation and cannot be changed. Only Privileged Role Administrators or Global Admins can change the membership."],
 3:["The three device states","Entra registered (BYOD), Entra joined (cloud-only corporate device), Hybrid joined (joined to AD DS and Entra)."],
 4:["Trust in cross-tenant access settings","You can trust MFA, compliant device and hybrid joined device claims from the home tenant, so an authentication already performed is not requested twice."],
 5:["Prerequisite for leaked credentials detection","Password hash synchronization must be enabled."],
 6:["Scoping filters in Entra Connect","By domain, by organizational unit or by attribute. The OU filter is the most common."],
 7:["How many pass-through authentication agents?","At least three for high availability, on separate servers."],
 8:["Three uses of the Temporary Access Pass","Bootstrap a passwordless method, recover a lost key, onboard a remote new joiner."],
 9:["Phishing-resistant methods","FIDO2 passkey, Windows Hello for Business, certificate-based authentication."],
 10:["AND or OR between grant controls","Require all controls = AND. Require one control = OR."],
 11:["What If versus the sign-in log","What If simulates a hypothetical sign-in before deployment. The log explains a real sign-in that already happened."],
 12:["What triggers CAE","Account disabled or deleted, password changed, sessions revoked, high user risk detected, network location change."],
 13:["What authentication context is for","Applying a stronger requirement to a specific resource inside an application, through a sensitivity label, a SharePoint site or a protected action."],
 14:["User risk versus sign-in risk","User risk rates the likelihood that the account is compromised; remediation is a secure password change. Sign-in risk rates the session; remediation is MFA."],
 15:["Three outcomes for a risk","Remediate (the user fixes it), dismiss (false positive), confirm compromise (feeds the model)."],
 16:["What SSPR writeback adds","The password reset in the cloud is written back to Active Directory, which is what makes domain resources accept it."],
 17:["Private Access versus Internet Access","Private Access secures access to internal resources. Internet Access filters and secures outbound traffic to the internet and Microsoft 365."],
 18:["The trigger phrase for managed identities","Without storing credentials or with no secret to manage, for a workload running in Azure."],
 19:["Delegated versus application permission","Delegated: the app acts on behalf of a signed-in user and effective access is the intersection of rights. Application: no user, admin consent is mandatory."],
 20:["Three user consent settings","Do not allow, allow for verified publishers with low-impact permissions, allow all. Complete it with the request workflow."],
 21:["Why application proxy opens no port","The connector opens an outbound connection to the cloud service, which relays the traffic."],
 22:["The two halves of SaaS integration","SSO (SAML, OIDC, password) and provisioning (SCIM) for account lifecycle."],
 23:["What Conditional Access App Control adds","A reverse proxy that allows real-time action inside the session: block download, copy-paste, printing, including on third-party applications."],
 24:["What an access package contains","Resources from a catalog (groups, applications, SharePoint sites) plus one or more policies defining who requests, who approves, and for how long."],
 25:["Reviewer options for an access review","Group owners, selected users, the users themselves, managers. Multi-stage reviews are supported."],
 26:["Three states of a PIM assignment","Eligible (to be activated), active (permanent or time-bound), expired."],
 27:["Rules for a break-glass account","At least two accounts, cloud-only, excluded from policies that could cause a lockout, long password stored physically, alert on every sign-in."],
 28:["Three diagnostic destinations","Log Analytics for KQL analysis, a storage account for archiving, Event Hubs for streaming to a SIEM."],
 29:["What the provisioning log contains","Provisioning operations towards SaaS applications, cross-tenant synchronization and lifecycle workflows."],
 30:["Why security defaults and Conditional Access cannot coexist","Security defaults enforce a fixed baseline; you must turn them off to take control with policies."],
 31:["Verifying a custom domain","Publish the TXT or MX record provided by Entra in the public DNS zone."],
 32:["Lifetime of a client secret","Limited, with a maximum duration enforced. A certificate is preferable for production applications."],
 33:["Where terms of use apply","As a grant control in a Conditional Access policy, with periodic re-acceptance and configurable expiry."],
 34:["Filter for devices: typical use","Targeting devices by attribute, for example privileged access workstations identified by an extension attribute."],
 35:["Group-based licensing: effect of removal","The licence is removed automatically and the data for that service enters a grace period."],
 36:["Entra Kerberos: what cloud trust is for","Letting a passwordless-authenticated device obtain Kerberos tickets for domain resources, notably with Windows Hello for Business."],
 37:["System- or user-assigned: how to decide","One resource with a linked lifecycle: system. Several resources or an identity provisioned in advance: user."],
 38:["Automatic application of results","Without that option, review decisions are recorded but nothing is actually changed."],
 39:["Direction of cross-tenant synchronization","Configured outbound on the source tenant and accepted inbound on the target tenant, in the cross-tenant access settings."]
};
